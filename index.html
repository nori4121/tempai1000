/* 集計の行の下に差し込む、該当問題の一覧 */
function aggExpand(row){
  const tr = document.createElement('tr'); tr.className = 'expand';
  const td = document.createElement('td'); td.colSpan = 4;

  const hits = [];
  for (let i = 0; i < records.length; i++) if (row.test(records[i])) hits.push(i);

  td.appendChild(recHead(false, (row.name || row.label) + ' の問題　' + hits.length + '問'));
  const n = Math.min(aggShown, hits.length);
  for (let k = 0; k < n; k++){
    const i = hits[hits.length - 1 - k];
    td.appendChild(recBlock(i, aggOpenRec, j => {
      aggOpenRec = (aggOpenRec === j ? -1 : j); renderAgg();
    }));
  }
  td.appendChild(el('rec-note', REC_NOTE));
  if (n < hits.length){
    const more = document.createElement('button');
    more.className = 'btn more';
    more.textContent = 'さらに表示（残り ' + (hits.length - n) + ' 問）';
    more.onclick = ev => { ev.stopPropagation(); aggShown += 50; renderAgg(); };
    td.appendChild(more);
  }
  tr.appendChild(td);
  return tr;
}
/* 記録から待ちの形を出し直す */
function shapeOf(r){
  if (r.kind === 'noten' || r.win == null) return '';
  const c = new Array(34).fill(0);
  for (const t of (r.hand || [])) c[t]++;
  c[r.win]++;
  try { return waitShape(c, r.win, r.ba, r.ji) || ''; } catch (e) { return ''; }
}
function renderAgg(){
  const v = $('aggView'); v.textContent = '';
  if (!records.length){ v.appendChild(el('empty', 'まだ記録がありません。')); return; }
  const h = t => { const x = document.createElement('h2'); x.textContent = t; return x; };

  /* 1問目 … 風 */
  const winds = [[27,'東家'],[28,'南家'],[29,'西家'],[30,'北家']];
  const windRecs = records.filter(r => r.ok0 != null);
  if (windRecs.length){
    v.appendChild(h('1問目 ─ 自分の風ごとの正答率'));
    v.appendChild(aggTable('wind', ['自分の風','正解／出題','分からない','正答率'], winds.map(([w,label]) => {
      const test = r => r.ok0 != null && r.ji === w;
      const rs = windRecs.filter(test);
      return { label, name: '自分の風 ' + label, n: rs.length,
               ok: rs.filter(r => r.ok0).length, dk: rs.filter(r => dkOf(r,0)).length, test };
    })));
  }

  /* 手の種類別 */
  const kinds = [['yaku','テンパイ（役あり）'],['noyaku','テンパイ（役なし）'],
                 ['mixed','テンパイ（待ちによる）'],['noten','テンパイしていない']];
  v.appendChild(h((windRecs.length ? '2問目' : '1問目') + ' ─ 手の種類ごとの正答率'));
  v.appendChild(aggTable('kind', ['種類','正解／出題','分からない','正答率'], kinds.map(([k,label]) => {
    const test = r => r.kind === k;
    const rs = records.filter(test);
    return { label, n: rs.length, ok: rs.filter(r => r.ok && r.ok[0]).length,
             dk: rs.filter(r => dkOf(r,1)).length, test };
  })));

  /* 待ちの形別（2問目） */
  const shapes = ['両面待ち','嵌張待ち','辺張待ち','シャンポン待ち','単騎待ち'];
  const byShape = {};
  for (const r of records){
    if (r.kind === 'noten' || !r.ok || r.ok[1] == null) continue;
    const sh = shapeOf(r); if (!sh) continue;
    (byShape[sh] = byShape[sh] || {n:0, ok:0, dk:0});
    byShape[sh].n++; if (r.ok[1]) byShape[sh].ok++; if (dkOf(r,2)) byShape[sh].dk++;
  }
  v.appendChild(h((windRecs.length ? '3問目' : '2問目') + ' ─ 待ちの形ごとの正答率'));
  v.appendChild(aggTable('shape', ['待ちの形','正解／出題','分からない','正答率'], shapes.map(sh => ({
    label: sh, n: (byShape[sh]||{}).n || 0, ok: (byShape[sh]||{}).ok || 0,
    dk: (byShape[sh]||{}).dk || 0,
    test: r => r.kind !== 'noten' && r.ok && r.ok[1] != null && shapeOf(r) === sh
  }))));

  /* 役別（3問目） */
  const keys = ALL_YAKU.map(o => o.key).concat(['nowin']);
  v.appendChild(h((windRecs.length ? '4問目' : '3問目') + ' ─ 役ごとの正答率（その役が正解に含まれる問題）'));
  v.appendChild(aggTable('yaku', ['役','正解／出題','分からない','正答率'], keys.map(k => {
    const test = r => {
      if (r.kind === 'noten' || !r.ok || r.ok[2] == null) return false;
      return realKeys(r).indexOf(k) >= 0;
    };
    const rs = records.filter(test);
    return { label: yakuLabel(k), n: rs.length, ok: rs.filter(r => r.ok[2]).length,
             dk: rs.filter(r => dkOf(r,3)).length, test };
  }).filter(row => row.n > 0)));

  /* 5問目 … 点数 */
  const ptRecs = records.filter(r => r.ok4 != null && r.hf);
  if (ptRecs.length){
    const bands = [['1〜2翻', h => h <= 2], ['3〜4翻', h => h === 3 || h === 4],
                   ['満貫', h => h === 5], ['跳満以上', h => h >= 6]];
    v.appendChild(h('5問目 ─ 翻数ごとの正答率'));
    v.appendChild(aggTable('pt', ['翻数','正解／出題','分からない','正答率'], bands.map(([label, f]) => {
      const test = r => r.ok4 != null && r.hf && f(r.hf.han);
      const rs = records.filter(test);
      return { label, n: rs.length, ok: rs.filter(r => r.ok4).length,
               dk: rs.filter(r => dkOf(r,4)).length, test };
    }).filter(row => row.n > 0)));
  }

  /* 日ごと */
  const byDay = {};
  for (const r of records){
    const d = ymd(r.at); if (!d) continue;
    const o = byDay[d] = byDay[d] || {n:0, w:0, s0:0, s1:0, t:0, s2:0, s3:0, p:0, s4:0};
    o.n++; if (r.ok0 != null){ o.w++; if (r.ok0) o.s0++; }
    if (r.ok4 != null){ o.p++; if (r.ok4) o.s4++; }
    if (r.ok && r.ok[0]) o.s1++;
    if (r.kind !== 'noten'){ o.t++; if (r.ok && r.ok[1]) o.s2++; if (r.ok && r.ok[2]) o.s3++; }
  }
  const days = Object.keys(byDay).sort().reverse();
  v.appendChild(h('日ごとの推移'));
  const t = document.createElement('table');
  const hr = document.createElement('tr');
  for (const c of ['日付','問題数','風あて','聴牌判定','待ち当て','役当て','点数']){
    const th = document.createElement('th'); th.textContent = c; hr.appendChild(th);
  }
  t.appendChild(hr);
  const pc = (a,b) => b ? Math.round(a/b*100) + '%' : '—';
  for (const d of days){
    const o = byDay[d], tr = document.createElement('tr');
    const c0 = document.createElement('td'); c0.textContent = d; tr.appendChild(c0);
    for (const val of [o.n + '問', pc(o.s0,o.w), pc(o.s1,o.n), pc(o.s2,o.t), pc(o.s3,o.t), pc(o.s4,o.p)]){
      const td = document.createElement('td'); td.className = 'n'; td.textContent = val; tr.appendChild(td);
    }
    t.appendChild(tr);
  }
  v.appendChild(t);
}

function renderFoot(){
  const on = ALL_YAKU.filter(o => settings.on[o.key]);
  const names = on.map(o => o.label.replace(/（.*?）/g, '')).join('・');
  const f = $('foot'); f.textContent = '';
  if (!on.length){
    f.appendChild(el('', '設定で役がひとつもONになっていません。'));
    return;
  }
  f.appendChild(document.createTextNode('答えに使う役は '));
  const b = document.createElement('b'); b.textContent = names;
  f.appendChild(b);
  f.appendChild(document.createTextNode(' の' + on.length
    + '種類。全問門前（鳴きなし）・完全先付け（片アガリ禁止）です。'));
}

/* ---------- 設定 ---------- */
/* 設定画面で編集中の内容。「設定完了」を押すまで本体には反映しない */
let draft = null;
const cloneSettings = o => ({
  on: Object.assign({}, o.on), notenRate: o.notenRate,
  score: o.score, rules: Object.assign({}, o.rules)
});

function renderConf(){
  if (!draft) draft = cloneSettings(settings);
  const v = $('confView'); v.textContent = '';
  const cnt = ALL_YAKU.filter(o => draft.on[o.key]).length;

  const h = t => { const x = document.createElement('h2'); x.textContent = t; return x; };
  v.appendChild(h('出題する役　' + cnt + '／' + ALL_YAKU.length + ' 種類'));
  v.appendChild(el('conf-note',
    'ONにした役だけを出題します。OFFの役がつく手は出てきません。' +
    'メンゼンツモをOFFにすると全問ロン、リーチをOFFにすると全問リーチなしになります。' +
    'ONが' + MAX_CHOICES + '種類を超えたときは、問4の選択肢が多くなりすぎないよう、' +
    '正解の役に無作為のダミーを混ぜて' + MAX_CHOICES + '個だけ並べます。'));

  const box = el('conf-list');
  for (const o of ALL_YAKU){
    const on = draft.on[o.key];
    const b = document.createElement('button');
    b.className = 'conf-item' + (on ? ' on' : '');
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
    b.appendChild(el('ci-box', on ? '✓' : ''));
    b.appendChild(el('ci-label', o.label));
    b.onclick = () => { draft.on[o.key] = !on; renderConf(); };
    box.appendChild(b);
  }
  v.appendChild(box);

  const act = el('actions conf-act');
  const all = document.createElement('button');
  all.className = 'btn'; all.textContent = 'すべてON（' + ALL_YAKU.length + '種類）';
  all.onclick = () => { for (const o of ALL_YAKU) draft.on[o.key] = true; renderConf(); };
  const def = document.createElement('button');
  def.className = 'btn'; def.textContent = 'はじめの9つに戻す';
  def.onclick = () => {
    for (const o of ALL_YAKU) draft.on[o.key] = DEFAULT_ON.indexOf(o.key) >= 0;
    renderConf();
  };
  act.appendChild(all); act.appendChild(def);
  v.appendChild(act);

  /* ---- 点数計算 ---- */
  v.appendChild(h('点数計算'));
  v.appendChild(el('conf-note',
    'ONにすると設問が5つになり、最後に点数を答えます。卓にドラ表示牌が出ます。' +
    'リーチした回の裏ドラ表示牌は、5問目になってから出ます。赤ドラは扱いません。'));
  const sbox = el('conf-list');
  const sw = (key, label, obj) => {
    const on = obj[key];
    const b = document.createElement('button');
    b.className = 'conf-item' + (on ? ' on' : '');
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
    b.appendChild(el('ci-box', on ? '✓' : ''));
    b.appendChild(el('ci-label', label));
    b.onclick = () => { obj[key] = !on; renderConf(); };
    return b;
  };
  sbox.appendChild(sw('score', '点数計算をする', draft));
  v.appendChild(sbox);

  if (draft.score){
    v.appendChild(el('conf-note', '細かい取り決め'));
    const rbox = el('conf-list');
    rbox.appendChild(sw('renpuu4', '連風牌の雀頭を4符にする', draft.rules));
    rbox.appendChild(sw('kiriage', '切り上げ満貫を採用する', draft.rules));
    rbox.appendChild(sw('kazoe',   '数え役満を採用する',     draft.rules));
    v.appendChild(rbox);
  }

  v.appendChild(h('テンパイしていない手の割合'));
  const rate = el('conf-rate');
  for (const r of [0, 0.1, 0.25, 0.4, 0.5]){
    const b = document.createElement('button');
    const on = Math.abs(draft.notenRate - r) < 0.001;
    b.className = 'chip' + (on ? ' on' : '');
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
    b.textContent = Math.round(r*100) + '%';
    b.onclick = () => { draft.notenRate = r; renderConf(); };
    rate.appendChild(b);
  }
  v.appendChild(rate);

  v.appendChild(el('conf-note',
    '「設定完了」を押すまで設定は効きません。押すと、いま表示中の問題は破棄され、新しい設定の問題になります。'));
  const fin = el('actions conf-act');
  const go = document.createElement('button');
  go.className = 'btn primary'; go.textContent = '設定完了';
  go.onclick = () => {
    settings = draft; draft = null;
    saveSettings(); renderFoot();
    tab = 'drill'; renderTab();
    newProblem();
  };
  fin.appendChild(go);
  v.appendChild(fin);
}

/* ---------- 進行 ---------- */
function newProblem(){
  P = makeProblem();
  if (!P){
    const p = $('panel'); p.textContent = '';
    p.appendChild(el('empty', 'この設定では問題を作れません。設定で役をもう少しONにしてください。'));
    const act = el('actions');
    const go = document.createElement('button');
    go.className = 'btn primary'; go.textContent = '設定を開く';
    go.onclick = () => { tab = 'conf'; renderTab(); };
    act.appendChild(go); p.appendChild(act);
    $('tableHost').textContent = '';
    return;
  }
  said0 = { ba:null, ji:null };
  said1 = null; picked = new Set(); pickedYaku = new Set();
  score = { s0:null, s1:null, s2:null, s3:null, s4:null };
  dunno = { s0:false, s1:false, s2:false, s3:false, s4:false };
  said4 = null; q4opts = null; q5opts = null;
  review = null;
  curRec = null; curIdx = -1;
  render();
}

$('ver').textContent = 'v' + APP_VERSION;
loadSettings();
loadRecords();
renderFoot();
renderStats();
renderTab();
renderSaveState();
$('save').onclick = saveFile;
/* アーティファクトの中では書き出しが使えない。db が使えるか分かるまで隠しておく */
if (!SHOW_SAVE || (window.claude && typeof window.claude.use === 'function')) $('save').hidden = true;
newProblem();
initStore();
</script>
