@import url("https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap");

/* ============ トークン ============ */
:root{
  /* 牌そのものから採った配色 */
  --ivory:#FFFDF7; --ivory-2:#F2EDE0; --ivory-edge:#CFC7B2; --ivory-rim:#BCB29A;
  --sumi:#1B1B18;  --sumi-2:#3D3B36;
  --aka:#B1332C;   /* 萬子の赤・中 */
  --ai:#1F4F8F;    /* 筒子の藍 */
  --midori:#2C7A4B;/* 索子の緑・發 */
  --midori-d:#1E5836;

  --bg:#F5F3ED;
  --surface:#FFFFFF;
  --surface-2:#FAF8F2;
  --line:#E4E0D5;
  --line-2:#D4CFC1;
  --ink:var(--sumi);
  --sub:#6A665C;
  --bar:#E9E5DB;
  --bar-line:#D8D3C6;

  --ok:var(--midori);
  --ng:var(--aka);
  --ok-fill:#1E5836; --ng-fill:#A82F28;
  --ok-text:#1E5836; --ng-text:#A82F28;
  --hint:var(--ai);

  --mincho:"Shippori Mincho","Yu Mincho","Hiragino Mincho ProN","Noto Serif JP","Noto Sans CJK JP",serif;
  --gothic:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic Medium","Yu Gothic",Meiryo,"BIZ UDPGothic","Noto Sans CJK JP",sans-serif;

  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#17171A; --surface:#212126; --surface-2:#1B1B1F;
    --line:#33333A; --line-2:#42424B;
    --ink:#F2F0EA; --sub:#B0ABA2;
    --bar:#3A3A42; --bar-line:#4A4A54;
    --aka:#D9534C; --ai:#5A8FD0; --midori:#4FA974; --midori-d:#2C7A4B;
    --ok-fill:#2C7A4B; --ng-fill:#B1332C;
    --ok-text:#6FBF8F; --ng-text:#E0736C;
  }
}
:root[data-theme="dark"]{
  --bg:#17171A; --surface:#212126; --surface-2:#1B1B1F;
  --line:#33333A; --line-2:#42424B;
  --ink:#F2F0EA; --sub:#B0ABA2;
  --bar:#3A3A42; --bar-line:#4A4A54;
  --aka:#D9534C; --ai:#5A8FD0; --midori:#4FA974; --midori-d:#2C7A4B;
    --ok-fill:#2C7A4B; --ng-fill:#B1332C;
    --ok-text:#6FBF8F; --ng-text:#E0736C;
}

*{box-sizing:border-box}
body{
  margin:0;padding:22px 16px 72px;
  background:var(--bg);color:var(--ink);
  font-family:var(--gothic);font-size:16.5px;line-height:1.8;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:800px;margin:0 auto;display:flex;flex-direction:column;gap:18px}

/* ============ ヘッダ ============ */
header{display:flex;align-items:baseline;justify-content:space-between;gap:14px;flex-wrap:wrap}
h1{
  font-family:var(--mincho);font-size:27px;font-weight:600;letter-spacing:.12em;
  margin:0;line-height:1.2;
}
h1 .sub{
  display:block;font-family:var(--gothic);font-size:12px;font-weight:400;
  letter-spacing:.16em;color:var(--sub);margin-top:5px;
}
h1 .ver{margin-left:14px;letter-spacing:.06em;font-variant-numeric:tabular-nums}
h1 .dev{
  display:inline-block;vertical-align:middle;margin-left:14px;
  font-family:var(--gothic);font-size:12px;font-weight:600;letter-spacing:.12em;
  color:var(--aka);border:1.5px solid var(--aka);border-radius:4px;padding:2px 9px;
}
.savebox{display:flex;align-items:center;gap:12px}
.unsaved{font-size:13px;color:var(--sub);white-space:nowrap}
.unsaved.pending{color:var(--aka);font-weight:600}
.btn.save{padding:8px 18px;font-size:14.5px;border-radius:999px}
.btn.dunno{border-color:var(--line-2);color:var(--sub);background:none}
.btn.dunno:hover{border-color:var(--sub);color:var(--ink)}
.btn.mark{border-color:var(--line-2);color:var(--sub)}
.btn.mark:hover{border-color:var(--ai);color:var(--ai)}
.btn.mark.on{background:var(--ai);border-color:var(--ai);color:#fff}

/* ============ タブ ============ */
#drill{display:flex;flex-direction:column;gap:18px}
[hidden]{display:none !important}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tab{
  border:none;background:none;color:var(--sub);font-size:15px;
  padding:9px 18px 10px;border-bottom:2px solid transparent;margin-bottom:-1px;
}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);border-bottom-color:var(--ai);font-weight:500}
.tab .n{font-size:12px;color:var(--sub);margin-left:6px;font-variant-numeric:tabular-nums}

/* ============ 記録一覧 ============ */
.empty{color:var(--sub);font-size:14.5px;text-align:center;padding:26px 0}
.agg tr.link{cursor:pointer}
.agg tr.link:hover td{background:var(--surface-2)}
.agg tr.link.on td{background:var(--surface-2);border-bottom-color:var(--line-2)}
.agg tr.expand td{background:var(--surface-2);padding:4px 10px 16px;border-bottom:1px solid var(--line-2)}
.rec-head.flat{position:static;background:none}
.rec{border-top:2px solid var(--line-2)}
.rec.open{
  background:var(--surface-2);
  border-top:2px solid var(--sub);border-bottom:2px solid var(--sub);
  margin:0 -6px;padding:0 6px;
}
.rec.open .rec-row{background:none}
.rec-line{display:flex;align-items:center;gap:8px}
.btn.redo{
  flex:none;padding:5px 12px;font-size:12.5px;border-radius:999px;
  white-space:nowrap;
}
.redo-sp{flex:none;width:74px}
.rec-row{
  display:flex;align-items:center;gap:12px;width:100%;min-width:0;
  background:none;border:none;padding:9px 4px;text-align:left;color:var(--ink);
}
.rec-row:hover{background:var(--surface-2)}
.rec-no{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums;width:56px;flex:none;line-height:1.4}
.rec-no b{display:block;font-family:var(--mincho);font-size:15px;color:var(--ink);font-weight:600}
.rec-hand{display:flex;gap:2px;flex-wrap:nowrap;overflow:hidden;flex:1;min-width:0}
.rec-hand .tile{--w:clamp(13px,2.9vw,21px)}
.rec-hand .drawn{margin-left:9px}
.marks{
  display:flex;flex:none;background:var(--surface);
  border:1px solid var(--line-2);border-radius:4px;overflow:hidden;
}
.mk{
  width:28px;height:24px;line-height:24px;font-size:14px;
  text-align:center;color:var(--sub);border-left:1px solid var(--line-2);
}
.mk:first-child{border-left:0}
.rec-head{
  position:sticky;top:0;z-index:2;background:var(--surface);
  display:flex;align-items:center;gap:12px;padding:7px 4px 6px;
  border-bottom:1px solid var(--line-2);
}
.rec-head .sp{flex:1;font-size:11.5px;letter-spacing:.1em;color:var(--sub)}
.mkhead{display:flex;flex:none;padding:0 1px}
.mkh{width:28px;font-size:11px;line-height:1.3;text-align:center;color:var(--sub);letter-spacing:0}
.rec-note{font-size:12px;color:var(--sub);padding:8px 4px 0}
.mk.o{color:var(--ok-text);font-weight:600}
.mk.x{color:var(--ng-text);font-weight:600}
.mk.q{color:var(--sub);font-weight:700;font-size:13px}
.rec-flag{width:20px;flex:none;text-align:center;color:var(--ai);font-size:15px}
.rec-open{padding:2px 4px 18px}
.rec-ans{display:flex;flex-direction:column;gap:7px;font-size:14px;margin-top:10px}
.rec-ans .lab{font-size:11.5px;letter-spacing:.12em;color:var(--sub);width:46px;flex:none}
.rec-ans .row{display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.rec-ans .tile{--w:clamp(18px,4vw,26px)}
.rec-ans .ng{color:var(--ng-text)}
.rec-ans .ok{color:var(--ok-text)}
.rec-ans .dk{color:var(--sub)}
.rec-ans .lab2{font-size:12px;color:var(--sub)}
.more{display:block;margin:14px auto 0}

/* ============ 設定 ============ */
.conf h2{
  font-family:var(--gothic);font-size:11.5px;letter-spacing:.14em;color:var(--sub);
  font-weight:500;margin:22px 0 8px;
}
.conf h2:first-child{margin-top:0}
.conf-note{font-size:13px;color:var(--sub);line-height:1.8;margin:0 0 12px}
.conf-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px}
.conf-item{
  display:flex;align-items:center;gap:10px;text-align:left;
  border:1px solid var(--line);background:var(--surface-2);color:var(--sub);
  border-radius:8px;padding:9px 13px;font-size:14.5px;
}
.conf-item:hover{border-color:var(--sub)}
.conf-item.on{border-color:var(--ai);background:color-mix(in srgb,var(--ai) 8%,var(--surface));color:var(--ink)}
.ci-box{
  width:20px;height:20px;flex:none;border:1px solid var(--line-2);border-radius:5px;
  font-size:13px;line-height:19px;text-align:center;background:var(--surface);
}
.conf-item.on .ci-box{background:var(--ai);border-color:var(--ai);color:#fff}
.conf-act{margin-top:14px}
.conf-rate{display:flex;gap:8px;flex-wrap:wrap}
.conf-rate .chip.on{border-color:var(--ai);background:color-mix(in srgb,var(--ai) 12%,var(--surface));font-weight:500}

/* ============ 集計 ============ */
.agg h2{
  font-family:var(--gothic);font-size:11.5px;letter-spacing:.14em;color:var(--sub);
  font-weight:500;margin:22px 0 8px;
}
.agg h2:first-child{margin-top:0}
.agg table{width:100%;border-collapse:collapse;font-size:14px}
.agg th,.agg td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
.agg th{font-size:11.5px;letter-spacing:.1em;color:var(--sub);font-weight:500;white-space:nowrap}
.agg td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.agg td.p{width:38%;min-width:120px}
.bar{display:flex;align-items:center;gap:9px}
.bar-track{flex:1;height:7px;border-radius:4px;background:var(--line);overflow:hidden}
.bar-fill{height:100%;background:var(--ai);border-radius:4px}
.bar-val{font-variant-numeric:tabular-nums;font-size:13.5px;width:44px;text-align:right;flex:none}
.agg .dim{color:var(--sub)}

/* ============ 成績バー ============ */
.stats{
  display:flex;gap:0;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);overflow:hidden;
}
.stat{flex:1;padding:9px 12px 10px;border-left:1px solid var(--line);min-width:0}
.stat:first-child{border-left:0}
.stat .k{font-size:11.5px;letter-spacing:.1em;color:var(--sub);white-space:nowrap}
.stat .v{font-family:var(--mincho);font-size:23px;font-variant-numeric:tabular-nums;line-height:1.3}
.stat .v small{font-size:12px;color:var(--sub);font-family:var(--gothic);margin-left:2px}

/* ============ 卓 ============ */
.table{
  background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:16px 14px 18px;
}
.seats{
  display:grid;grid-template-columns:48px 1fr 48px;grid-template-rows:34px 118px auto;
  align-items:center;justify-items:center;gap:10px;
}
.bar{background:var(--bar);border:1px solid var(--bar-line);border-radius:3px;position:relative}
.seat-top{grid-column:2;grid-row:1;width:52%;height:20px}
.seat-left{grid-column:1;grid-row:2;width:20px;height:70%;transform:rotate(9deg)}
.seat-right{grid-column:3;grid-row:2;width:20px;height:70%;transform:rotate(-9deg)}
.oya{
  position:absolute;font-size:15px;letter-spacing:.1em;color:var(--aka);
  white-space:nowrap;font-weight:700;
}
.seat-top .oya{top:-25px;left:50%;transform:translateX(-50%)}
.seat-left .oya{top:-25px;left:50%;transform:translateX(-50%) rotate(-9deg)}
.seat-right .oya{top:-25px;left:50%;transform:translateX(-50%) rotate(9deg)}
.center{grid-column:2;grid-row:2;display:flex;flex-direction:column;align-items:center;gap:2px}
.ba-row{display:flex;align-items:center;gap:18px}
.inds{
  display:flex;align-items:center;gap:16px;
  border:2px solid var(--aka);border-radius:8px;padding:3px 13px 6px;
}
.ind{display:flex;flex-direction:column;align-items:center;gap:3px}
.ind-cap{font-size:11px;letter-spacing:.06em;color:var(--sub);white-space:nowrap}
.ind .tile{--w:clamp(20px,4.4vw,32px)}
.ba{font-family:var(--mincho);font-size:25px;letter-spacing:.22em;color:var(--sub);font-weight:600}
.ba-self{font-size:16px;letter-spacing:.08em;color:var(--aka);height:23px;font-weight:600}
.mine{grid-column:1/-1;grid-row:3;display:flex;flex-direction:column;align-items:center;gap:7px;width:100%}
.mine .oya-self{font-size:15px;letter-spacing:.1em;color:var(--aka);font-weight:700;height:20px}
.hand{display:flex;gap:3px;justify-content:center;flex-wrap:nowrap}
.hand .drawn{margin-left:13px}
.table.inline{margin:12px 0 6px}
.table.inline .seats{grid-template-rows:32px 92px auto;gap:8px}
.table.inline .tile{--w:clamp(19px,4.2vw,32px)}
.winhand{display:flex;gap:3px;flex-wrap:wrap;align-items:flex-end;margin:12px 0 4px}
.winhand .tile{--w:clamp(20px,4.4vw,30px)}
.winhand .drawn{margin-left:11px}

/* ============ 牌 ============ */
.tile{
  --w:clamp(21px,5.3vw,40px); --h:calc(var(--w)*1.35);
  position:relative;width:var(--w);height:var(--h);
  border-radius:calc(var(--w)*0.13);
  background:linear-gradient(170deg,var(--ivory) 0%,var(--ivory) 62%,var(--ivory-2) 100%);
  border:1px solid var(--ivory-edge);
  box-shadow:0 2px 0 var(--ivory-rim),0 3px 5px rgba(0,0,0,.14),inset 0 1px 0 rgba(255,255,255,.9);
  display:flex;align-items:center;justify-content:center;flex:none;
  user-select:none;transition:transform .12s ease, box-shadow .12s ease;
}
.tile.win{
  box-shadow:0 2px 0 var(--ivory-rim),0 3px 5px rgba(0,0,0,.14),
             inset 0 1px 0 rgba(255,255,255,.9),0 0 0 2px var(--ai);
}
.face{width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:calc(var(--w)*0.08)}
.face > svg{width:100%;height:100%;display:block;overflow:visible}
.man{flex-direction:column;justify-content:center;font-family:var(--mincho)}
.man .num{font-size:calc(var(--w)*0.52);line-height:1;color:#1B1B1B;font-weight:600}
.man .wan{font-size:calc(var(--w)*0.42);line-height:1.15;color:#B1332C;font-weight:600}
.honor{font-family:var(--mincho);font-size:calc(var(--w)*0.60);font-weight:600;line-height:1}
.honor.kaze{color:#1B1B1B}
.honor.hatsu{color:#1F7A4D}
.honor.chun{color:#B1332C}
.haku{width:62%;height:70%;border:calc(var(--w)*0.05) solid #2F5F9E;border-radius:2px;box-shadow:inset 0 0 0 calc(var(--w)*0.03) #fff}

/* ============ 設問 ============ */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 16px 18px}
.q{font-family:var(--mincho);font-size:19.5px;letter-spacing:.04em;margin:0 0 3px}
.q + .choices{margin-top:14px}
.q-note{font-size:13.5px;color:var(--sub);margin:0 0 14px}

.choices{display:flex;gap:9px;flex-wrap:wrap}
button{font-family:var(--gothic);font-size:15.5px;cursor:pointer}
.btn{
  border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink);
  border-radius:8px;padding:10px 20px;transition:border-color .12s, background .12s;
}
.btn:hover{border-color:var(--sub)}
.btn:focus-visible{outline:2px solid var(--ai);outline-offset:2px}
.btn.on{border-color:var(--ai);background:color-mix(in srgb,var(--ai) 10%,var(--surface));color:var(--ink)}
.btn.primary{background:var(--midori-d);border-color:var(--midori-d);color:#fff}
.btn.primary:hover{background:var(--midori)}
.btn:disabled{opacity:.6;cursor:default}
.btn.two{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:8px 18px;line-height:1.45}
.blabel{font-size:15.5px}
.bnote{font-size:12px;color:var(--sub);letter-spacing:.02em}
.btn.two.on .bnote{color:var(--ai)}

.windrow{display:flex;align-items:center;gap:14px;margin:10px 0}
.windlab{font-size:13.5px;color:var(--sub);width:74px;flex:none}
.windrow .yaku-chips{margin-bottom:0}
.chip.wind{font-family:var(--mincho);font-size:18px;font-weight:600;padding:5px 20px;letter-spacing:.1em}

.picker{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.prow2{display:flex;gap:3px;flex-wrap:wrap}
.pick{
  --w:clamp(24px,5.4vw,34px);
  cursor:pointer;background:none;border:none;padding:0;
  border-radius:calc(var(--w)*0.13);
}
.pick .tile{--w:inherit}
.pick[aria-pressed="true"] .tile{
  transform:translateY(-7px);
  box-shadow:0 2px 0 var(--ivory-rim),0 9px 12px rgba(0,0,0,.24),0 0 0 2px var(--ai);
}
.pick:focus-visible{outline:2px solid var(--ai);outline-offset:2px}

.sub-q{font-size:12px;letter-spacing:.14em;color:var(--sub);margin:16px 0 7px}
.yaku-chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.chip{
  border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink);
  border-radius:999px;padding:8px 17px;font-size:15px;
}
.chip[aria-pressed="true"]{border-color:var(--ai);background:color-mix(in srgb,var(--ai) 12%,var(--surface));font-weight:500}
.chip:focus-visible{outline:2px solid var(--ai);outline-offset:2px}
.chip.pt{font-variant-numeric:tabular-nums;font-size:15.5px;padding:9px 20px}
.chip.pt.on{border-color:var(--ai);background:color-mix(in srgb,var(--ai) 12%,var(--surface));font-weight:600}
.brk{font-size:14px;line-height:1.9;color:var(--ink)}
.brk.total{font-family:var(--mincho);font-size:18px;font-weight:600}

.qblock{

<script>
/* ==========================================================
   麻雀 判定エンジン
   0-8=1m..9m / 9-17=1p..9p / 18-26=1s..9s
   27=東 28=南 29=西 30=北 31=白 32=發 33=中
   ========================================================== */
const JP = (() => {
  const k = ['','一','二','三','四','五','六','七','八','九'], a = [];
  for (let n=1;n<=9;n++) a.push(k[n]+'萬');
  for (let n=1;n<=9;n++) a.push(n+'筒');
  for (let n=1;n<=9;n++) a.push(n+'索');
  return a.concat(['東','南','西','北','白','發','中']);
})();
const isHonor = i => i >= 27;
const suitOf  = i => (i < 27 ? Math.floor(i/9) : 3);
const rankOf  = i => (i < 27 ? (i%9)+1 : 0);
const isTerminal = i => isHonor(i) || rankOf(i)===1 || rankOf(i)===9;
const total = c => c.reduce((a,b)=>a+b,0);

function walk(c, acc, out){
  let i = 0; while (i < 34 && c[i] === 0) i++;
  if (i === 34){ out.push(acc.slice()); return; }
  if (c[i] >= 3){
    c[i]-=3; acc.push({type:'set',start:i}); walk(c,acc,out); acc.pop(); c[i]+=3;
  }
  if (i < 27 && rankOf(i) <= 7 && c[i+1] > 0 && c[i+2] > 0){
    c[i]--;c[i+1]--;c[i+2]--; acc.push({type:'run',start:i}); walk(c,acc,out); acc.pop(); c[i]++;c[i+1]++;c[i+2]++;
  }
}
function decompose(counts){
  const res = [], c = counts.slice();
  for (let p=0;p<34;p++){
    if (c[p] < 2) continue;
    c[p]-=2;
    const found = []; walk(c,[],found);
    for (const melds of found) res.push({pair:p, melds});
    c[p]+=2;
  }
  return res;
}
/* 七対子。同じ牌2枚が7種類。4枚使いは認めない（標準ルール） */
function isChiitoi(c14){
  let pairs = 0;
  for (let i=0;i<34;i++){
    if (c14[i] === 0) continue;
    if (c14[i] !== 2) return false;
    pairs++;
  }
  return pairs === 7;
}
const isWin = c => total(c) === 14 && (decompose(c).length > 0 || isChiitoi(c));

/* 面子の分け方に関係なく決まる性質 */
function suitInfo(c14){
  let hasTerminal = false; const suits = new Set(); let honors = 0;
  for (let i=0;i<34;i++){
    if (!c14[i]) continue;
    if (isTerminal(i)) hasTerminal = true;
    if (isHonor(i)) honors++; else suits.add(suitOf(i));
  }
  return { hasTerminal, isChinitsu: suits.size===1 && honors===0,
           isHonitsu: suits.size===1 && honors>0 };
}

function waits(c13){
  const res = [];
  for (let i=0;i<34;i++){
    if (c13[i] >= 4) continue;
    c13[i]++; if (isWin(c13)) res.push(i); c13[i]--;
  }
  return res;
}
function isChiitoitsuTenpai(c){
  let pairs=0, singles=0;
  for (let i=0;i<34;i++){
    if (c[i]===2) pairs++; else if (c[i]===1) singles++; else if (c[i]!==0) return false;
  }
  return pairs===6 && singles===1;
}
function isKokushiTenpai(c){
  let kinds=0, pair=0, other=0;
  for (let i=0;i<34;i++){
    if (!c[i]) continue;
    if (!isTerminal(i)){ other++; continue; }
    kinds++; if (c[i]>=2) pair++;
  }
  if (other) return false;
  return kinds===13 || (kinds===12 && pair===1);
}

function yakuhaiOf(dec, bakaze, jikaze){
  const list = [];
  for (const m of dec.melds){
    if (m.type !== 'set') continue;
    const i = m.start;
    if (i===31||i===32||i===33) list.push(JP[i]);
    if (i===bakaze) list.push('場風 '+JP[i]);
    if (i===jikaze) list.push('自風 '+JP[i]);
  }
  return list;
}
function ryanmenRun(dec, winTile){
  for (const m of dec.melds){
    if (m.type !== 'run') continue;
    const s = m.start, r = rankOf(s);
    if (winTile === s && r <= 6) return m;
    if (winTile === s+2 && r >= 2) return m;
  }
  return null;
}
function evalDec(c14, dec, winTile, bakaze, jikaze, winBy){
  const yaku = [];
  const si = suitInfo(c14);
  const runs = dec.melds.filter(m => m.type === 'run');
  const sets = dec.melds.filter(m => m.type === 'set');
  const isChinitsu = si.isChinitsu;

  /* --- 牌の種類で決まるもの --- */
  if (!si.hasTerminal) yaku.push({key:'tanyao', name:'タンヤオ', han:1});
  if (isChinitsu)        yaku.push({key:'chinitsu', name:'清一色', han:6});
  else if (si.isHonitsu) yaku.push({key:'honitsu', name:'ホンイツ', han:3});

  /* --- 役牌・小三元 --- */
  for (const n of yakuhaiOf(dec, bakaze, jikaze)) yaku.push({key:'yakuhai', name:'役牌（'+n+'）', han:1});
  if (sets.filter(m => m.start >= 31).length === 2 && dec.pair >= 31)
    yaku.push({key:'shousangen', name:'小三元', han:2});

  /* --- ピンフ --- */
  const allRuns = runs.length === 4;
  const pairYakuhai = dec.pair===31||dec.pair===32||dec.pair===33||dec.pair===bakaze||dec.pair===jikaze;
  if (allRuns && !pairYakuhai && ryanmenRun(dec, winTile)) yaku.push({key:'pinfu', name:'ピンフ', han:1});

  /* --- 一盃口・二盃口（二盃口が立てば一盃口は付けない） --- */
  const rk = {}; for (const m of runs) rk[m.start] = (rk[m.start]||0) + 1;
  let pairsOfRuns = 0, dup = 0;
  for (const k in rk){ pairsOfRuns += Math.floor(rk[k]/2); if (rk[k] >= 2) dup++; }
  if (pairsOfRuns >= 2)   yaku.push({key:'ryanpeiko', name:'二盃口', han:3});
  else if (dup >= 1)      yaku.push({key:'iipeiko',   name:'一盃口', han:1});

  /* --- 一気通貫 --- */
  for (const su of [0,1,2]){
    const st = new Set(runs.filter(m => suitOf(m.start)===su).map(m => rankOf(m.start)));
    if (st.has(1) && st.has(4) && st.has(7)){ yaku.push({key:'ittsu', name:'一気通貫', han:2}); break; }
  }

  /* --- 三色同順・三色同刻 --- */
  const byRank = {};
  for (const m of runs){ const r = rankOf(m.start); (byRank[r] = byRank[r] || new Set()).add(suitOf(m.start)); }
  for (const r in byRank) if (byRank[r].size >= 3){ yaku.push({key:'sanshoku', name:'三色同順', han:2}); break; }
  const setRank = {};
  for (const m of sets){ if (isHonor(m.start)) continue; const r = rankOf(m.start); (setRank[r] = setRank[r] || new Set()).add(suitOf(m.start)); }
  for (const r in setRank) if (setRank[r].size >= 3){ yaku.push({key:'sanshokudoukou', name:'三色同刻', han:2}); break; }

  /* --- 対々和・暗刻の数 --- */
  if (sets.length === 4) yaku.push({key:'toitoi', name:'対々和', han:2});
  /* 門前なので、ロンで刻子を完成させたときだけ1つ明刻になる */
  const ronSet = (winBy === 'ron') && sets.some(m => m.start === winTile);
  const ankou  = sets.length - (ronSet ? 1 : 0);
  if (ankou === 4)      yaku.push({key:'suuankou', name:'四暗刻', han:13});
  else if (ankou === 3) yaku.push({key:'sanankou', name:'三暗刻', han:2});

  /* --- チャンタ・純チャン・混老頭（上位ひとつだけ） --- */
  const yaoMeld = m => m.type === 'set' ? isTerminal(m.start) : (rankOf(m.start)===1 || rankOf(m.start)===7);
  if (dec.melds.every(yaoMeld) && isTerminal(dec.pair)){
    let allYaoTiles = true, hasHonor = false;
    for (let i=0;i<34;i++) if (c14[i] && !isTerminal(i)) allYaoTiles = false;
    for (let i=27;i<34;i++) if (c14[i]) hasHonor = true;
    if (allYaoTiles)    yaku.push({key:'honroutou', name:'混老頭', han:2});
    else if (!hasHonor) yaku.push({key:'junchan',   name:'純チャン', han:3});
    else                yaku.push({key:'chanta',    name:'チャンタ', han:2});
  }

  /* 役満は単独。四暗刻が立ったら他の役は数えない */
  const suu = yaku.find(y => y.key === 'suuankou');
  if (suu) return {yaku:[suu], isChinitsu};

  return {yaku, isChinitsu};
}

/* 対象外にする役満。四暗刻だけは役として扱うので、ここには入れない */
function bigYaku(c14, dec){
  const bad = [];
  const sets = dec ? dec.melds.filter(m => m.type==='set') : [];
  const GREEN = new Set([19,20,21,23,25,32]);        // 2索3索4索6索8索發
  let honors = 0, allHonor = true, allTerminal = true, green = true, any = false;
  for (let i=0;i<34;i++){
    if (!c14[i]) continue;
    any = true;
    if (isHonor(i)) honors += c14[i]; else allHonor = false;
    if (!isTerminal(i)) allTerminal = false;
    if (!GREEN.has(i)) green = false;
  }
  if (any && allHonor)                  bad.push('字一色');
  if (any && allTerminal && honors===0) bad.push('清老頭');
  if (any && green)                     bad.push('緑一色');
  if (sets.filter(m => m.start >= 31).length === 3) bad.push('大三元');
  const windSets = sets.filter(m => m.start >= 27 && m.start <= 30).length;
  if (windSets === 4) bad.push('大四喜');
  if (windSets === 3 && dec && dec.pair >= 27 && dec.pair <= 30) bad.push('小四喜');
  for (const su of [0,1,2]){
    let only = true, n = 0;
    for (let i=0;i<34;i++) if (c14[i]){ if (suitOf(i)!==su) only = false; else n += c14[i]; }
    if (!only || n !== 14) continue;
    const base = su*9;
    let ok = c14[base] >= 3 && c14[base+8] >= 3;
    for (let r=1;r<=7;r++) if (c14[base+r] < 1) ok = false;
    if (ok) bad.push('九蓮宝燈');
  }
  return bad;
}

function judgeWin(c14, winTile, bakaze, jikaze, winBy){
  const decs = decompose(c14);
  const chiitoi = isChiitoi(c14);
  if (!decs.length && !chiitoi) return null;

  const RULES = (typeof settings !== 'undefined' && settings.rules)
              ? settings.rules : {renpuu4:true, kiriage:true, kazoe:true};
  let best = null;
  for (const d of decs){
    const r = evalDec(c14, d, winTile, bakaze, jikaze, winBy);
    const han = r.yaku.reduce((a,y)=>a+y.han,0);
    const f = fuOf(c14, d, winTile, bakaze, jikaze, winBy, r.yaku, RULES);
    if (!best || han > best.han || (han === best.han && f.fu > best.fu))
      best = {han, yaku:r.yaku, dec:d, isChinitsu:r.isChinitsu, fu:f.fu, fuRaw:f.raw, fuParts:f.parts};
  }
  if (chiitoi){
    const si = suitInfo(c14);
    const yaku = [{key:'chiitoi', name:'七対子', han:2}];
    if (!si.hasTerminal)   yaku.push({key:'tanyao', name:'タンヤオ', han:1});
    if (si.isChinitsu)     yaku.push({key:'chinitsu', name:'清一色', han:6});
    else if (si.isHonitsu) yaku.push({key:'honitsu', name:'ホンイツ', han:3});
    let allYao = true;
    for (let i=0;i<34;i++) if (c14[i] && !isTerminal(i)) allYao = false;
    if (allYao) yaku.push({key:'honroutou', name:'混老頭', han:2});
    const han = yaku.reduce((a,y)=>a+y.han,0);
    if (!best || han > best.han)
      best = {han, yaku, dec:null, isChinitsu:si.isChinitsu, fu:25, fuRaw:25, fuParts:[['七対子',25]]};
  }

  const big = new Set();
  for (const d of decs) for (const n of bigYaku(c14, d)) big.add(n);
  for (const n of bigYaku(c14, null)) big.add(n);
  best.bigYaku = [...big];
  return best;
}

/* ==========================================================
   符計算・点数計算
   ========================================================== */
/* ドラ表示牌の次の牌がドラ */
function doraOf(ind){
  if (ind < 27) { const r = ind % 9; return ind - r + ((r + 1) % 9); }
  if (ind <= 30) return 27 + ((ind - 27 + 1) % 4);      // 東南西北
  return 31 + ((ind - 31 + 1) % 3);                      // 白發中
}
function countDora(c14, inds){
  let n = 0;
  for (const ind of inds){ if (ind == null) continue; n += c14[doraOf(ind)] || 0; }
  return n;
}

/* この分け方での符。parts は内訳の説明 */
function fuOf(c14, dec, winTile, bakaze, jikaze, winBy, yaku, rules){
  const has = k => yaku.some(y => y.key === k);
  if (has('chiitoi')) return { fu:25, raw:25, parts:[['七対子', 25]] };
  if (has('pinfu'))
    return winBy === 'tsumo' ? { fu:20, raw:20, parts:[['ピンフ・ツモ', 20]] }
                             : { fu:30, raw:30, parts:[['副底', 20], ['門前ロン', 10]] };

  const parts = [['副底', 20]];
  let fu = 20;
  if (winBy === 'ron'){ fu += 10; parts.push(['門前ロン', 10]); }
  else               { fu += 2;  parts.push(['ツモ', 2]); }

  /* 面子。ロンで完成した刻子だけ明刻あつかい */
  let ronUsed = false;
  for (const m of dec.melds){
    if (m.type !== 'set') continue;
    const yao = isTerminal(m.start);
    let open = false;
    if (winBy === 'ron' && m.start === winTile && !ronUsed){ open = true; ronUsed = true; }
    const v = open ? (yao ? 4 : 2) : (yao ? 8 : 4);
    fu += v;
    parts.push([(open ? '明刻' : '暗刻') + '（' + JP[m.start] + '）', v]);
  }

  /* 雀頭 */
  let head = 0;
  if (dec.pair >= 31) head += 2;
  if (dec.pair === bakaze) head += 2;
  if (dec.pair === jikaze) head += 2;
  if (!rules.renpuu4 && head > 2) head = 2;              // 連風牌を2符とする流儀
  if (head){ fu += head; parts.push(['雀頭（' + JP[dec.pair] + '）', head]); }

  /* 待ち */
  let wait = 0, waitName = '';
  if (dec.pair === winTile){ wait = 2; waitName = '単騎待ち'; }
  else {
    for (const m of dec.melds){
      if (m.type !== 'run') continue;
      const r = rankOf(m.start);
      if (winTile === m.start + 1){ wait = 2; waitName = '嵌張待ち'; break; }
      if (winTile === m.start && r === 7){ wait = 2; waitName = '辺張待ち'; break; }
      if (winTile === m.start + 2 && r === 1){ wait = 2; waitName = '辺張待ち'; break; }
    }
  }
  if (wait){ fu += wait; parts.push([waitName, wait]); }

  const up = Math.ceil(fu / 10) * 10;
  return { fu: up, raw: fu, parts };
}

/* 翻と符から点数。base は「基本点」 */
function basePoints(han, fu, isYakuman, rules){
  if (isYakuman)                 return { name:'役満',   base:8000 };
  if (han >= 13 && rules.kazoe)  return { name:'数え役満', base:8000 };
  const h = (han >= 13 && !rules.kazoe) ? 12 : han;
  if (h >= 11) return { name:'三倍満', base:6000 };
  if (h >= 8)  return { name:'倍満',   base:4000 };
  if (h >= 6)  return { name:'跳満',   base:3000 };
  if (h === 5) return { name:'満貫',   base:2000 };
  const b = fu * Math.pow(2, 2 + h);
  if (b >= 2000)                    return { name:'満貫', base:2000 };
  if (rules.kiriage && b === 1920)  return { name:'切り上げ満貫', base:2000 };
  return { name:'', base:b };
}
const ceil100 = n => Math.ceil(n / 100) * 100;

/* 支払い。oya … 自分が親か */
function payments(base, oya, winBy){
  if (winBy === 'ron'){
    const t = ceil100(base * (oya ? 6 : 4));
    return { kind:'ron', total:t, split:null };
  }
  if (oya){
    const each = ceil100(base * 2);
    return { kind:'tsumo-oya', each, total: each * 3, split: each + ' オール' };
  }
  const ko = ceil100(base), oyaPay = ceil100(base * 2);
  /* 内訳は 子の支払い / 親の支払い */
  return { kind:'tsumo-ko', ko, oyaPay, total: ko * 2 + oyaPay, split: ko + ' / ' + oyaPay };
}
/* 選択肢や解説に出す文字列。「8000点（4000 / 2000・子の満貫）」 */
function payLabel(pay, rankName, oya){
  const inner = [];
  if (pay.split) inner.push(pay.split);
  if (rankName) inner.push((oya ? '親' : '子') + 'の' + (rankName === '切り上げ満貫' ? '満貫' : rankName));
  return pay.total + '点' + (inner.length ? '（' + inner.join('・') + '）' : '');
}

/* まとめて計算する */
function scoreOf(best, c14, winTile, bakaze, jikaze, winBy, oya, doraInds, rules, riichi){
  const isYakuman = best.yaku.some(y => y.key === 'suuankou');
  /* リーチとメンゼンツモは judgeWin の外で持っているので、ここで足す */
  const extra = isYakuman ? 0 : ((riichi ? 1 : 0) + (winBy === 'tsumo' ? 1 : 0));
  const yakuHan = best.yaku.reduce((a, y) => a + y.han, 0) + extra;
  const dora = countDora(c14, doraInds);
  const han = isYakuman ? yakuHan : yakuHan + dora;
  const f = best.fu != null ? { fu:best.fu, raw:best.fuRaw, parts:best.fuParts } : { fu:30, raw:30, parts:[] };
  const bp = basePoints(han, f.fu, isYakuman, rules);
  const pay = payments(bp.base, oya, winBy);
  return { han, yakuHan, dora, fu:f.fu, fuRaw:(f.raw == null ? f.fu : f.raw), fuParts:f.parts,
           rank:bp.name, base:bp.base, pay };
}

/* 待ちの形の呼び名 */
function waitShape(c14, winTile, bakaze, jikaze){
  const decs = decompose(c14);
  if (!decs.length && isChiitoi(c14)) return '単騎待ち';
  let fallback = '';
  for (const d of decs){
    if (ryanmenRun(d, winTile)) return '両面待ち';
  }
  for (const d of decs){
    if (d.pair === winTile) { fallback = fallback || '単騎待ち'; continue; }
    for (const m of d.melds){
      if (m.type==='set' && m.start===winTile) { fallback = fallback || 'シャンポン待ち'; }
      if (m.type==='run'){
        const s=m.start, r=rankOf(s);
        if (winTile===s+1) fallback = fallback || '嵌張待ち';
        else if ((winTile===s && r===7) || (winTile===s+2 && r===1)) fallback = fallback || '辺張待ち';
      }
    }
  }
  return fallback || '';
}

/* ==========================================================
   問題ジェネレータ
   ========================================================== */
const rnd = n => Math.floor(Math.random()*n);
const pick = a => a[rnd(a.length)];
const SANGEN = [31,32,33];
const HONORS_ALL = [27,28,29,30,31,32,33];
const RUNS_ALL = (()=>{const a=[];for(const b of [0,9,18])for(let r=0;r<=6;r++)a.push(b+r);return a;})();
const RUNS_SIMPLE = (()=>{const a=[];for(const b of [0,9,18])for(let r=1;r<=5;r++)a.push(b+r);return a;})();
const TILES_ALL = Array.from({length:34},(_,i)=>i);
const TILES_SIMPLE = (()=>{const a=[];for(const b of [0,9,18])for(let r=1;r<=7;r++)a.push(b+r);return a;})();
const runsOfSuit = s => {const a=[];for(let r=0;r<=6;r++)a.push(s*9+r);return a;};
const tilesOfSuit = s => {const a=[];for(let r=0;r<=8;r++)a.push(s*9+r);return a;};

function addMeld(c,m){ if(m.type==='run'){c[m.start]++;c[m.start+1]++;c[m.start+2]++;} else c[m.start]+=3; }
const overflow = c => c.some(v=>v>4);
function assemble(melds, pair){
  const c = new Array(34).fill(0);
  for (const m of melds) addMeld(c,m);
  c[pair]+=2;
  return overflow(c) ? null : c;
}
function build(target, bakaze, jikaze){
  const melds = []; let pair;
  if (target === 'tanyao'){
    const n = rnd(3);
    for (let i=0;i<n;i++) melds.push({type:'set',start:pick(TILES_SIMPLE)});
    while (melds.length<4) melds.push({type:'run',start:pick(RUNS_SIMPLE)});
    pair = pick(TILES_SIMPLE);
  } else if (target === 'yakuhai'){
    melds.push({type:'set',start:pick(SANGEN.concat([bakaze,jikaze]))});
    if (Math.random()<0.3) melds.push({type:'set',start:pick(TILES_ALL)});
    while (melds.length<4) melds.push({type:'run',start:pick(RUNS_ALL)});
    pair = pick(TILES_ALL);
  } else if (target === 'honitsu'){
    const s = rnd(3);
    const nh = 1 + rnd(2);
    for (let i=0;i<nh && melds.length<2;i++) melds.push({type:'set',start:pick(HONORS_ALL)});
    while (melds.length<4) melds.push({type:'run',start:pick(runsOfSuit(s))});
    pair = Math.random()<0.5 ? pick(HONORS_ALL) : pick(tilesOfSuit(s));
  } else if (target === 'iipeiko'){
    const r = pick(RUNS_ALL);
    melds.push({type:'run',start:r},{type:'run',start:r});
    if (Math.random()<0.3) melds.push({type:'set',start:pick(TILES_ALL)});
    while (melds.length<4) melds.push({type:'run',start:pick(RUNS_ALL)});
    pair = pick(TILES_ALL);
  } else if (target === 'pinfu'){
    while (melds.length<4) melds.push({type:'run',start:pick(RUNS_ALL)});
    const bad = new Set(SANGEN.concat([bakaze,jikaze]));
    pair = pick(TILES_ALL.filter(t=>!bad.has(t)));
  } else if (target === 'ittsu'){
    const su = rnd(3);
    melds.push({type:'run', start:su*9}, {type:'run', start:su*9+3}, {type:'run', start:su*9+6});
    if (Math.random() < 0.4){                       /* 字牌を足してホンイツにもなる形 */
      melds.push({type:'set', start:pick(HONORS_ALL)});
      pair = Math.random()<0.5 ? pick(HONORS_ALL) : pick(tilesOfSuit(su));
    } else {                                        /* 別の色を1面子 */
      const o = (su + 1 + rnd(2)) % 3;
      melds.push({type:'run', start:pick(runsOfSuit(o))});
      pair = Math.random()<0.5 ? pick(tilesOfSuit(o)) : pick(HONORS_ALL);
    }

  } else if (target === 'chiitoi'){
    /* 異なる7種の対子。字牌が多くなりすぎないよう軽く抑える */
    const pool = TILES_ALL.slice();
    for (let i=pool.length-1;i>0;i--){ const j=rnd(i+1); const t=pool[i]; pool[i]=pool[j]; pool[j]=t; }
    const picked = pool.slice(0,7);
    const c = new Array(34).fill(0);
    for (const t of picked) c[t] = 2;
    return c;

  } else if (target === 'mixed'){
    /* 例：23筒 の両面。4筒ならタンヤオ、1筒だと么九牌が入って崩れる。
       ピンフが両方の待ちに乗らないよう、刻子を1つ入れておく。       */
    melds.push({type:'set', start: pick(TILES_SIMPLE)});
    const r1 = pick(RUNS_SIMPLE);
    let r2 = pick(RUNS_SIMPLE);
    for (let i=0;i<8 && r2===r1;i++) r2 = pick(RUNS_SIMPLE);
    if (r2 === r1) return null;
    melds.push({type:'run', start:r1}, {type:'run', start:r2});
    pair = pick(TILES_SIMPLE);
    const c = assemble(melds, pair);
    if (!c) return null;
    /* 端にかかる両面の受け（23 か 78）を2枚足す */
    const suit = rnd(3);
    const base = suit*9 + (Math.random()<0.5 ? 1 : 6);
    c[base]++; c[base+1]++;
    return overflow(c) ? null : c;
  } else if (target === 'sanshoku'){
    const r = rnd(7);                                   // 123〜789
    for (const su of [0,1,2]) melds.push({type:'run', start:su*9+r});
    melds.push({type:'run', start:pick(RUNS_ALL)});
    pair = pick(TILES_ALL);

  } else if (target === 'sanshokudoukou'){
    const r = 1 + rnd(9) - 1;                           // 1〜9
    for (const su of [0,1,2]) melds.push({type:'set', start:su*9+r});
    melds.push({type:'run', start:pick(RUNS_ALL)});
    pair = pick(TILES_ALL);

  } else if (target === 'ryanpeiko'){
    const a = pick(RUNS_ALL);
    let b = pick(RUNS_ALL);
    for (let i=0;i<10 && b===a;i++) b = pick(RUNS_ALL);
    if (b === a) return null;
    melds.push({type:'run',start:a},{type:'run',start:a},{type:'run',start:b},{type:'run',start:b});
    pair = pick(TILES_ALL);

  } else if (target === 'toitoi' || target === 'sanankou' || target === 'suuankou'){
    const nSets = target === 'sanankou' ? 3 : 4;
    for (let i=0;i<nSets;i++) melds.push({type:'set', start:pick(TILES_ALL)});
    while (melds.length < 4) melds.push({type:'run', start:pick(RUNS_ALL)});
    pair = pick(TILES_ALL);

  } else if (target === 'chanta' || target === 'junchan'){
    const honorsOk = target === 'chanta';
    const edgeRuns = [0,6,9,15,18,24];                  // 123 / 789 の3色
    const yaoTiles = [0,8,9,17,18,26];                  // 1・9
    const src = honorsOk ? yaoTiles.concat(HONORS_ALL) : yaoTiles;
    let usedHonor = false;
    for (let i=0;i<4;i++){
      if (Math.random() < 0.45){
        const t = pick(src);
        if (isHonor(t)) usedHonor = true;
        melds.push({type:'set', start:t});
      } else melds.push({type:'run', start:pick(edgeRuns)});
    }
    pair = pick(src);
    if (isHonor(pair)) usedHonor = true;
    if (honorsOk && !usedHonor) return null;            // 字牌が無いと純チャンになる
    if (!honorsOk && usedHonor) return null;

  } else if (target === 'honroutou'){
    const src = [0,8,9,17,18,26].concat(HONORS_ALL);
    for (let i=0;i<4;i++) melds.push({type:'set', start:pick(src)});
    pair = pick(src);

  } else if (target === 'shousangen'){
    const sh = SANGEN.slice();
    for (let i=sh.length-1;i>0;i--){ const j=rnd(i+1); const t=sh[i]; sh[i]=sh[j]; sh[j]=t; }
    melds.push({type:'set', start:sh[0]}, {type:'set', start:sh[1]});
    while (melds.length < 4) melds.push({type:'run', start:pick(RUNS_ALL)});
    pair = sh[2];

  } else if (target === 'chinitsu'){
    const su = rnd(3);
    const nSets = rnd(2);
    for (let i=0;i<nSets;i++) melds.push({type:'set', start:pick(tilesOfSuit(su))});
    while (melds.length < 4) melds.push({type:'run', start:pick(runsOfSuit(su))});
    pair = pick(tilesOfSuit(su));

  } else {
    const n = rnd(3);
    for (let i=0;i<n;i++) melds.push({type:'set',start:pick(TILES_ALL)});
    while (melds.length<4) melds.push({type:'run',start:pick(RUNS_ALL)});
    pair = pick(TILES_ALL);
  }
  return assemble(melds, pair);
}
function dropOne(c14){
  const p = []; for (let i=0;i<34;i++) if (c14[i]) p.push(i);
  const c = c14.slice(); c[pick(p)]--; return c;
}
function validate(c13, bakaze, jikaze, maxWaits, winBy){
  if (total(c13)!==13) return null;
  if (isKokushiTenpai(c13)) return null;
  const w = waits(c13);
  if (!w.length || w.length > maxWaits) return null;
  const per = [];
  for (const t of w){
    const c14 = c13.slice(); c14[t]++;
    const r = judgeWin(c14, t, bakaze, jikaze, winBy);
    if (!r || r.bigYaku.length) return null;                 // 役満は扱わない
    const keys = r.yaku.map(y=>y.key);
    if (keys.some(k => !yakuOn(k))) return null;              // 対象外の役がつく手は出さない
    per.push({tile:t, yaku:r.yaku.map(y=>y.name), keys});
  }
  /* 待ちごとに役がつくかを見て、そろっているか混在かを決める */
  const f = per.map(x => x.keys.length > 0);
  const yakuKind = f.every(v => v) ? 'yaku' : f.every(v => !v) ? 'noyaku' : 'mixed';
  return {hand:c13, waits:w, perWait:per, yakuKind};
}
function makeNoten(){
  for (let i=0;i<400;i++){
    const c14 = build('none',27,28); if (!c14) continue;
    const c13 = dropOne(c14);
    const p = []; for (let k=0;k<34;k++) if (c13[k]) p.push(k);
    const from = pick(p), to = pick(TILES_ALL);
    if (from === to) continue;
    const d = c13.slice(); d[from]--; d[to]++;
    if (overflow(d) || total(d)!==13) continue;
    if (waits(d).length) continue;
    if (isChiitoitsuTenpai(d) || isKokushiTenpai(d)) continue;
    return d;
  }
  return null;
}
const windsFromOya = seat => 27 + ((4 - seat) % 4);

/* 狙って作る役。ONのものだけを回す */
const BUILDABLE = ['tanyao','pinfu','iipeiko','honitsu','yakuhai','chiitoi','ittsu',
                   'sanshoku','chanta','junchan','honroutou','ryanpeiko',
                   'sanshokudoukou','shousangen','chinitsu','toitoi','sanankou','suuankou'];
function rollTarget(){
  const pool = BUILDABLE.filter(k => settings.on[k]);
  const x = Math.random();
  if (!pool.length) return 'none';
  if (x < 0.18) return 'none';
  if (x < 0.32) return 'mixed';
  return pool[rnd(pool.length)];
}

/* ドラ表示牌を選ぶ。ドラ0枚ばかりにならないよう枚数を狙って探す */
function pickIndicator(c14, want){
  const cand = [];
  for (let i=0;i<34;i++) if ((c14[i]||0) < 4) cand.push(i);
  const hit = cand.filter(i => (c14[doraOf(i)]||0) === want);
  if (hit.length) return pick(hit);
  return pick(cand);
}
function rollDoraCount(){
  const x = Math.random();
  return x < 0.42 ? 0 : x < 0.76 ? 1 : 2;
}

function makeProblem(){
  for (let attempt=0; attempt<6000; attempt++){
    const bakaze = Math.random()<0.7 ? 27 : 28;
    /* メンゼンツモがOFFならロンだけ、リーチがOFFならリーチなしだけ */
    const winBy  = settings.on.tsumo ? (Math.random()<0.5 ? 'tsumo' : 'ron') : 'ron';
    const riichi = settings.on.riichi ? Math.random()<0.5 : false;
    const seatOfOya = rnd(4);
    const jikaze = windsFromOya(seatOfOya);
    if (Math.random() < settings.notenRate){
      const h = makeNoten(); if (!h) continue;
      return {tenpai:false, yakuKind:'noyaku', hand:h, waits:[], answerTile:null, answerYaku:[], answerKeys:[], bakaze, jikaze, seatOfOya, winBy, riichi, dora:null, ura:null};
    }
    const target = rollTarget();
    const built = build(target, bakaze, jikaze); if (!built) continue;
    const c13 = target === 'mixed' ? built : dropOne(built);
    const v = validate(c13, bakaze, jikaze, 3, winBy); if (!v) continue;
    if (target === 'mixed' && v.yakuKind !== 'mixed') continue;
    const cands = target === 'mixed' ? v.perWait
                : target === 'none'  ? v.perWait.filter(p=>!p.keys.length)
                : v.perWait.filter(p=>p.keys.includes(target));
    if (!cands.length) continue;
    const ans = pick(cands);
    /* 点数計算をONにしているときだけ、ドラ表示牌を決める */
    let dora = null, ura = null;
    if (settings.score){
      const c14 = v.hand.slice(); c14[ans.tile]++;
      dora = pickIndicator(c14, rollDoraCount());
      if (riichi){ const c2 = c14.slice(); c2[dora] = (c2[dora]||0); ura = pickIndicator(c2, rollDoraCount()); }
    }
    return {tenpai:true, yakuKind:v.yakuKind, hand:v.hand, waits:v.waits, answerTile:ans.tile, answerYaku:ans.yaku, answerKeys:ans.keys, bakaze, jikaze, seatOfOya, winBy, riichi, dora, ura};
  }
  return null;
}

function bamboo(cx, cy, w, h, red, deg){
  const col = red ? C_AKA : C_MIDORI, dk = red ? C_AKA_D : C_MIDORI_D;

  const rot = deg ? ' transform="rotate('+deg+' '+cx+' '+cy+')"' : '';
  return '<g'+rot+'>'
    /* 竹の幹 */
    + '<rect x="'+(cx-sw/2)+'" y="'+top+'" width="'+sw+'" height="'+h+'" rx="'+(sw*0.42)+'" fill="'+col+'"/>'

}

function tileEl(i, extra){

const $ = id => document.getElementById(id);
const NOWIN = {key:'nowin', label:'あがれない（チョンボになる）'};
/* 5役に加えて「メンゼンツモ」「あがれない」。どちらもツモ／ロン両方の回で出す。
   全問門前なので、ツモの回は必ずメンゼンツモがつく。他の役と重ねて選ぶ。
   「あがれない」だけは他と両立しないので単独選択。 */

/* 問4に並べる選択肢。ONの役が多いときは MAX_CHOICES 個までに絞る。
   正解の役はかならず入れ、残りはONの中からダミーを無作為に混ぜる。
   並びは ALL_YAKU の順のままにして、最後に「あがれない」を置く。 */
function yakuOptions(){
  const on = ALL_YAKU.filter(o => settings.on[o.key]);
  const room = MAX_CHOICES - 1;                    /* 「あがれない」の分 */
  if (on.length <= room) return on.concat([NOWIN]);
  const want = new Set(wantKeys());
  const keep = new Set(on.filter(o => want.has(o.key)).map(o => o.key));
  const rest = on.filter(o => !keep.has(o.key));
  for (let i = rest.length - 1; i > 0; i--){ const j = rnd(i + 1); const t = rest[i]; rest[i] = rest[j]; rest[j] = t; }
  for (const o of rest){ if (keep.size >= room) break; keep.add(o.key); }
  return on.filter(o => keep.has(o.key)).concat([NOWIN]);
}
const yakuLabelOf = k => {
  const o = ALL_YAKU.concat([NOWIN]).find(x => x.key === k);
  return o ? o.label : k;
};

/* 片アガリ禁止。役がつかない待ちを含む手は、リーチをしていなければロンではあがれない。
   ツモはメンゼンツモがつくので可。リーチをした回は役が確定するので対象外。 */
function isKataAgari(){
  return !!P.tenpai && P.yakuKind === 'mixed' && !P.riichi && P.winBy === 'ron';
}

/* いまの問題の正解（役のキーの集合） */
function wantKeys(){
  if (isKataAgari()) return ['nowin'];
  const base = [...new Set(P.answerKeys)];
  if (base.indexOf('suuankou') >= 0) return ['suuankou'];   // 役満は単独
  if (P.riichi) base.push('riichi');
  if (P.winBy === 'tsumo') base.push('tsumo');
  return base.length ? base : ['nowin'];
}
/* 記録から同じものを出し直す */
function realKeys(r){
  if (r.kind === 'mixed' && !r.ri && r.by === 'ron') return ['nowin'];
  const base = r.yaku ? [...new Set(r.yaku)] : [];
  if (base.indexOf('suuankou') >= 0) return ['suuankou'];
  if (r.ri) base.push('riichi');
  if (r.by === 'tsumo') base.push('tsumo');
  return base.length ? base : ['nowin'];
}

  if (!q4opts) q4opts = yakuOptions();

      }

    };

/* ---------- 5問目：点数 ---------- */
const isOya = () => P.seatOfOya === 0;
let review = null;                       // やり直し中のとき、元になった記録
let q4opts = null;                       // この問題の役の選択肢（作り直さない）
let q5opts = null;                       // この問題の点数の選択肢（作り直さない）

/* いまの問題の点数一式 */
function currentScore(){
  const c14 = P.hand.slice(); c14[P.answerTile]++;
  const j = judgeWin(c14, P.answerTile, P.bakaze, P.jikaze, P.winBy);
  if (!j) return null;
  const inds = [P.dora];
  if (P.riichi && P.ura != null) inds.push(P.ura);
  const s = scoreOf(j, c14, P.answerTile, P.bakaze, P.jikaze, P.winBy,
                    isOya(), inds, settings.rules, P.riichi);
  s.yaku = j.yaku;
  return s;
}
/* 点数を聞ける問題か（あがれる手で、点数計算がONのとき） */
function hasScoreQ(){
  return !!settings.score && P.tenpai && P.answerTile != null && P.dora != null
      && wantKeys().indexOf('nowin') < 0;
}
/* 選択肢。正解の周りの符・翻をずらして紛らわしいものを作る */
function scoreChoices(sc){
  const seen = {}, list = [];
  const add = (han, fu) => {
    if (han < 1 || fu < 20) return;
    const bp = basePoints(han, fu, false, settings.rules);
    const pay = payments(bp.base, isOya(), P.winBy);
    const label = payLabel(pay, bp.name, isOya());
    if (seen[label]) return;
    seen[label] = 1;
    list.push({ text: label, total: pay.total });
  };
  add(sc.han, sc.fu);
  const correct = list[0].text;
  for (const dh of [-2,-1,1,2]) for (const df of [-10,0,10]) add(sc.han + dh, sc.fu + df);
  for (const h of [5,6,8,11]) add(h, sc.fu);
  const others = list.filter(x => x.text !== correct);
  for (let i=others.length-1;i>0;i--){ const j=rnd(i+1); const t=others[i]; others[i]=others[j]; others[j]=t; }
  const shown = others.slice(0,3).concat(list.filter(x => x.text === correct));
  shown.sort((a,b) => a.total - b.total);
  return { correct, list: shown };
}

function q5Block(){
  const done = score.s4 !== null;
  const sc = currentScore();
  const blk = el('qblock');
  blk.appendChild(el('q', '【問５】さあ何点？'));
  if (review && prevScore()) blk.appendChild(prevScore());
  blk.appendChild(tableEl({ p:P, inline:true, win:true, showSelf:true, ind:true, ura:true }));

  const line = el('winline');
  line.appendChild(el('wl-ji', (P.riichi ? 'リーチをして' : 'リーチをしないで')
    + '、' + (isOya() ? '親' : '子') + 'が'));
  line.appendChild(tileEl(P.answerTile, 'win'));
  line.appendChild(el('wl-key', P.winBy === 'tsumo' ? 'ツモ' : 'ロン'));
  blk.appendChild(line);

  /* 問4で確定した役を再掲する */
  const yl = el('yakuline');
  yl.appendChild(el('yakuline-l', '役は：'));
  const ord = ALL_YAKU.map(o => o.key);
  const yk = wantKeys().slice().sort((a,b) => ord.indexOf(a) - ord.indexOf(b));
  for (const k of yk) yl.appendChild(el('yakuline-c', yakuLabel(k)));
  blk.appendChild(yl);

  if (!q5opts) q5opts = scoreChoices(sc);
  const box = el('yaku-chips');
  for (const o of q5opts.list){
    const b = document.createElement('button');
    b.className = 'chip pt' + (said4 === o.text ? ' on' : '');
    b.textContent = o.text;
    b.setAttribute('aria-pressed', said4 === o.text ? 'true' : 'false');
    if (done) b.disabled = true;
    else b.onclick = () => {
      if (tooSoon()) return;
      said4 = o.text; score.s4 = (o.text === q5opts.correct); render(true);
    };
    box.appendChild(b);
  }
  blk.appendChild(box);

  if (done){
    blk.appendChild(verdictLine(score.s4, dunno.s4));
    if (!score.s4) blk.appendChild(ansLine(d => d.appendChild(el('ansval', q5opts.correct))));
    blk.appendChild(scoreBreak(sc));
  } else {
    const act = el('actions');
    act.appendChild(dunnoBtn(() => {
      said4 = null; dunno.s4 = true; score.s4 = false; render(true);
    }));
    blk.appendChild(act);
  }
  return blk;
}

/* 符と翻の内訳 */
function scoreBreak(sc){
  const w = el('why');
  const h = t => { const x=document.createElement('h3'); x.textContent=t; return x; };
  const yakuman = sc.yaku.some(y => y.key === 'suuankou');

  w.appendChild(h('翻'));
  const hn = sc.yaku.map(y => y.name + ' ' + y.han);
  if (!yakuman){
    if (P.riichi) hn.push('リーチ 1');
    if (P.winBy === 'tsumo') hn.push('メンゼンツモ 1');
    if (sc.dora) hn.push('ドラ ' + sc.dora);
  }
  w.appendChild(el('brk', hn.join('　＋　') + '　＝　' + sc.han + '翻'));

  w.appendChild(h('符'));
  const fuLine = sc.fuParts.map(p => p[0] + ' ' + p[1]).join('　＋　') + '　＝　' + sc.fuRaw + '符'
    + (sc.fuRaw !== sc.fu ? '　→　切り上げ ' + sc.fu + '符' : '');
  w.appendChild(el('brk', fuLine));

  w.appendChild(h('点数'));
  w.appendChild(el('brk total', sc.fu + '符 ' + sc.han + '翻　→　'

/* 3問ぶん終わったか（外したところで打ち切る） */
function isDone(){
  if (score.s0 === null) return false;
  if (score.s1 === null) return false;
  if (!P.tenpai) return true;          // テンパイしていない手は1問で終わり
  if (score.s2 === null) return false;
  if (score.s3 === null) return false;
  if (hasScoreQ()) return score.s4 !== null;
  return true;
}

function scrollToLast(){
  const kids = $('panel').children;
  const last = kids[kids.length - 1];
  if (!last) return;
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  try { last.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'nearest' }); } catch (e) {}
}

function render(scroll){
  lastRender = Date.now();
  renderTable();
  const p = $('panel'); p.textContent = '';
  p.appendChild(q0Block());
  if (score.s0 !== null) p.appendChild(q1Block());
  /* 聴牌の手は、外しても最後まで答える */
  if (P.tenpai && score.s1 !== null) p.appendChild(q2Block());
  if (P.tenpai && score.s2 !== null) p.appendChild(q3Block());
  if (P.tenpai && score.s3 !== null && hasScoreQ()) p.appendChild(q5Block());
  if (isDone()){
    if (!curRec) record();          // 解き終えた時点で1問ぶん積む
    p.appendChild(explainBlock());
  }
  if (scroll) setTimeout(scrollToLast, 30);
}

function reasonFor(y, r, c14){
  if (y.key === 'tsumo')  return '門前のまま自分でツモった。それだけで1翻。';

  if (y.key === 'pinfu')  return '4面子すべて順子、雀頭が役牌でなく、待ちが両面。';
  if (y.key === 'iipeiko')return '同じ順子が2組そろっています。';

}

/* ---------- 記録 ----------
   保存先は「どう開かれたか」で自動的に決まる。
     db   … アーティファクトとして開かれたとき。1問ごとに自動保存
     file … HTMLファイルとして開かれたとき。「記録を保存」で書き出す
   どちらの場合もブラウザの保存領域（localStorage 等）は使わない。 */
const MARK  = /(<script id="mj-records"[^>]*>)[\s\S]*?(<\/script>)/;
const MARK2 = /(<script id="mj-settings"[^>]*>)[\s\S]*?(<\/script>)/;
const PRISTINE = '<!doctype html>\n' + document.documentElement.outerHTML;
let records = [];
let savedCount = 0;
let curRec = null;      // いま解いている問題の記録
let curIdx = -1;        // それが records の何番目か

let storeMode = 'file';                 // 'file' | 'db' | 'fs'
let DB = null, dbBusy = false, dbFailed = false;
let FS = null, fsBusy = false, fsFailed = false, fsTimer = null;
let FH = null, waitHandle = null;       // ブラウザ版。記録ファイルの参照
let fsaBusy = false, fsaFailed = false, fsaTimer = null;
const PAGE = 100;                       // 1ドキュメントにまとめる問題数
const pagePath = n => 'records/p' + String(n).padStart(4, '0');

function applySettings(o){
  if (!o || typeof o !== 'object') return;
  if (o.on && typeof o.on === 'object')
    for (const k in settings.on) if (typeof o.on[k] === 'boolean') settings.on[k] = o.on[k];
  if (typeof o.notenRate === 'number' && o.notenRate >= 0 && o.notenRate <= 1)
    settings.notenRate = o.notenRate;
  if (typeof o.score === 'boolean') settings.score = o.score;
  if (o.rules && typeof o.rules === 'object')
    for (const k in settings.rules) if (typeof o.rules[k] === 'boolean') settings.rules[k] = o.rules[k];
}
function loadSettings(){
  try {
    const raw = document.getElementById('mj-settings').textContent.trim();
    applySettings(raw ? JSON.parse(raw) : null);
  } catch (e) {}
}
function saveSettings(){
  if (storeMode === 'fsa'){ fsaWrite(); return; }
  if (storeMode === 'fs' && FS){
    FS.saveSettings({ on: settings.on, notenRate: settings.notenRate,
                      score: settings.score, rules: settings.rules })
      .catch(() => { fsFailed = true; renderSaveState(); });
    return;
  }
  if (storeMode === 'db' && DB){
    DB.doc('config/settings').set({ on: settings.on, notenRate: settings.notenRate, score: settings.score, rules: settings.rules })
      .catch(() => {});
  } else {
    savedJson = '';                    // ファイル版は「未保存」に落とす
    renderSaveState();
  }
}
function loadRecords(){
  try {
    const raw = document.getElementById('mj-records').textContent.trim();
    const a = raw ? JSON.parse(raw) : [];
    records = Array.isArray(a) ? a : [];
  } catch (e) { records = []; }
  savedCount = records.length;
  savedJson = JSON.stringify(records);
  recomputeAgg();
}
function recomputeAgg(){
  agg = { total:0, windN:0, s0:0, s1:0, tenpaiN:0, s2:0, s3:0, ptN:0, s4:0 };
  for (const r of records){
    agg.total++;
    if (r.ok0 != null){ agg.windN++; if (r.ok0) agg.s0++; }
    if (r.ok4 != null){ agg.ptN++;  if (r.ok4) agg.s4++; }
    if (r.ok && r.ok[0]) agg.s1++;
    if (r.kind !== 'noten'){
      agg.tenpaiN++;
      if (r.ok && r.ok[1]) agg.s2++;
      if (r.ok && r.ok[2]) agg.s3++;
    }
  }
}
/* 1問ぶんを記録に積む。手牌と和了牌を残しておけば、
   待ちの形や役はあとから判定エンジンで出し直せる。 */
function record(){
  curRec = {
    at:   new Date().toISOString(),
    hand: handTiles(P.hand),
    ba:   P.bakaze, ji: P.jikaze, oya: P.seatOfOya,
    by:   P.winBy,
    ri:   !!P.riichi,
    w:    [said0.ba, said0.ji],
    ok0:  score.s0,
    kind: q1Answer(),
    waits: P.waits.slice(),
    win:  P.answerTile,
    yaku: P.answerKeys.slice(),
    a1:   said1,
    a2:   [...picked],
    a3:   [...pickedYaku],
    ok:   [score.s1, score.s2, score.s3],
    ok4:  score.s4,
    a4:   said4,
    pt:   (score.s4 !== null && q5opts) ? q5opts.correct : null,
    hf:   (score.s4 !== null) ? (function(){ const x = currentScore();
            return x ? { han:x.han, fu:x.fu, rank:x.rank, dora:x.dora } : null; })() : null,
    dora: P.dora, ura: P.ura,
    dk:   [dunno.s0, dunno.s1, dunno.s2, dunno.s3, dunno.s4],
    re:   !!review,
    mark: false
  };
  records.push(curRec);
  curIdx = records.length - 1;
  recomputeAgg();
  renderStats();
  renderTabs();
  renderSaveState();
  if (storeMode === 'db') dbWrite(curIdx);
  if (storeMode === 'fs') fsSave();
  if (storeMode === 'fsa') fsaWrite();
}
let savedJson = '[]';
function renderSaveState(){
  const tag = $('unsaved'), btn = $('save');
  const marked = records.filter(r => r.mark).length;

  if (storeMode === 'fsa'){                /* ブラウザ版 … 記録ファイルに自動保存 */
    if (!FH){
      btn.hidden = false; btn.disabled = false;
      btn.textContent = waitHandle ? '前回の記録に戻す' : '記録の保存先をえらぶ';
      btn.onclick = waitHandle ? fsaGrant : fsaPick;
      tag.textContent = waitHandle ? '記録は保存されていません' : '記録は保存されていません';
      tag.classList.add('pending');
      return;
    }
    btn.hidden = true;
    let t = fsaFailed ? '保存できませんでした' : fsaBusy ? '保存中…' : '自動保存';
    t += '　' + FH.name;
    if (marked) t += '　目印 ' + marked + '問';
    tag.textContent = t;
    tag.classList.toggle('pending', fsaFailed || fsaBusy);
    return;
  }
  if (storeMode === 'fs'){                 /* Electron版 … 自動保存 */
    btn.hidden = true;
    let t = fsFailed ? '保存できませんでした'
          : fsBusy   ? '保存中…'
          : records.length ? '自動保存' : '';
    if (marked) t += '　目印 ' + marked + '問';
    tag.textContent = t;
    tag.classList.toggle('pending', fsFailed || fsBusy);
    return;
  }
  if (!SHOW_SAVE && storeMode !== 'db'){   /* 手動保存を隠しているとき */
    btn.hidden = true; tag.textContent = ''; tag.classList.remove('pending');
    return;
  }
  if (storeMode === 'db'){                 /* アーティファクト … 自動保存 */
    btn.hidden = true;
    let t = dbFailed ? '保存できませんでした'
          : dbBusy   ? '保存中…'
          : records.length ? '自動保存' : '';
    if (marked) t += '　目印 ' + marked + '問';
    tag.textContent = t;
    tag.classList.toggle('pending', dbFailed || dbBusy);
    return;
  }
                                           /* HTMLファイル … 手動保存 */
  const dirty  = JSON.stringify(records) !== savedJson;
  const fresh  = records.length - savedCount;      // 保存後に増えた問題数
  let txt = '';
  if (records.length){
    txt = !dirty ? '保存済み'
        : fresh > 0 ? '未保存 ' + fresh + '問'
        : '未保存の変更あり';
    if (marked) txt += '　目印 ' + marked + '問';
  }
  tag.textContent = txt;
  tag.classList.toggle('pending', dirty);
  btn.disabled = !dirty;
}

/* ---------- ブラウザ版の記録置き場 ----------
   記録は利用者が選んだ普通のJSONファイルに書く。
   ブラウザに置くのは「どのファイルか」という参照だけで、記録そのものではない。 */
function idbOpen(){
  return new Promise((res, rej) => {
    const q = indexedDB.open('mj-store', 1);
    q.onupgradeneeded = () => q.result.createObjectStore('kv');
    q.onsuccess = () => res(q.result);
    q.onerror   = () => rej(q.error);
  });
}
async function idbGet(k){
  const db = await idbOpen();
  return new Promise((res, rej) => {
    const t = db.transaction('kv', 'readonly').objectStore('kv').get(k);
    t.onsuccess = () => res(t.result); t.onerror = () => rej(t.error);
  });
}
async function idbSet(k, v){
  const db = await idbOpen();
  return new Promise((res, rej) => {
    const t = db.transaction('kv', 'readwrite').objectStore('kv').put(v, k);
    t.onsuccess = () => res(); t.onerror = () => rej(t.error);
  });
}

/* 画面中央のダイアログ。本文と2つのボタンだけ */
function modal(title, body, yesLabel, onYes, noLabel, onNo){
  const ov = el('modal-ov');
  const card = el('modal');
  card.appendChild(el('modal-t', title));
  card.appendChild(el('modal-b', body));
  const act = el('actions');
  const close = () => ov.remove();

  const yes = document.createElement('button');
  yes.className = 'btn primary'; yes.textContent = yesLabel;
  yes.onclick = () => { close(); onYes(); };

  const no = document.createElement('button');
  no.className = 'btn'; no.textContent = noLabel;
  no.onclick = () => { close(); onNo(); };

  act.appendChild(yes); act.appendChild(no);
  card.appendChild(act);
  ov.appendChild(card);
  ov.onkeydown = (e) => { if (e.key === 'Escape') no.onclick(); };
  document.body.appendChild(ov);
  yes.focus();
}

/* 初回。記録を残すかどうかを案内する */
function askSetup(){

        '解いた記録と集計を、このパソコンのファイルに保存できます。\n'
      + '保存先を一度えらぶと、あとは解くたびに自動で書き込まれます。\n'
      + '次に開いたときも、その続きから始められます。',
        '保存先をえらぶ', () => { fsaPick(); },

}

/* 2回目以降。前回の記録ファイルを引き継ぐか聞く。
   ここのボタン操作が、許可を出し直すときの「利用者の操作」にもなる。 */
function askResume(h){
  modal('前回の記録が見つかりました',
        h.name + '\nこの続きから始めますか。',
        '前回の続きから', async () => {
          let ok = 'granted';
          try {
            if (await h.queryPermission({ mode:'readwrite' }) !== 'granted')
              ok = await h.requestPermission({ mode:'readwrite' });
          } catch (e) { ok = 'denied'; }
          if (ok !== 'granted'){ waitHandle = h; renderSaveState(); return; }
          FH = h; waitHandle = null;
          await fsaLoad();
          savedCount = records.length; savedJson = JSON.stringify(records);
          recomputeAgg(); renderStats(); renderFoot(); renderTab();
          if (score.s0 === null) newProblem();
          renderSaveState();
        },
        '新しく始める', () => { waitHandle = h; renderSaveState(); });
}

/* 保存先をえらぶ。すでに中身があれば取り込む */
async function fsaPick(){

  try {
    h = await window.showSaveFilePicker({
      suggestedName: 'tempai1000-kiroku.json',
      types: [{ description: 'テンパイ1000本ノックの記録', accept: { 'application/json': ['.json'] } }]
    });
  } catch (e) { return; }                 /* 取り消し */
  FH = h; waitHandle = null;
  try { await idbSet('handle', h); } catch (e) {}
  await fsaLoad();
  recomputeAgg(); renderStats(); renderFoot(); renderTab();
  if (score.s0 === null) newProblem();
  fsaWrite(); renderSaveState();
}
/* 前回の許可が残っていないときに、もう一度つなぐ */
async function fsaGrant(){
  if (!waitHandle) return fsaPick();
  let ok = 'denied';
  try { ok = await waitHandle.requestPermission({ mode: 'readwrite' }); } catch (e) {}
  if (ok !== 'granted') return;
  FH = waitHandle; waitHandle = null;
  await fsaLoad();
  recomputeAgg(); renderStats(); renderFoot(); renderTab();
  if (score.s0 === null) newProblem();
  fsaWrite(); renderSaveState();
}
async function fsaLoad(){
  if (!FH) return;
  let data = null;
  try {
    const t = await (await FH.getFile()).text();
    data = t.trim() ? JSON.parse(t) : null;
  } catch (e) { fsaFailed = true; return; }
  if (!data) return;
  if (data.settings) applySettings(data.settings);
  if (Array.isArray(data.records)) records = data.records.concat(records);
  if (curRec) curIdx = records.indexOf(curRec);
}
function fsaWrite(){
  if (!FH) return;
  clearTimeout(fsaTimer);
  fsaTimer = setTimeout(async () => {
    fsaBusy = true; renderSaveState();
    try {
      const w = await FH.createWritable();
      await w.write(JSON.stringify({
        app: 'tempai1000', version: APP_VERSION,
        settings: { on: settings.on, notenRate: settings.notenRate,
                    score: settings.score, rules: settings.rules },
        records: records
      }));
      await w.close();
      savedCount = records.length;
      savedJson  = JSON.stringify(records);
      fsaFailed = false;
    } catch (e) { fsaFailed = true; }
    fsaBusy = false; renderSaveState();
  }, 300);
}

/* ---------- Electron版の記録置き場 ----------
   userData の records.json にまるごと書く。書き込みは200ms間引く。 */
function fsSave(){
  if (!FS) return;
  clearTimeout(fsTimer);
  fsTimer = setTimeout(async () => {
    fsBusy = true; renderSaveState();
    try {
      await FS.saveRecords(records);
      savedCount = records.length;
      savedJson  = JSON.stringify(records);
      fsFailed = false;
    } catch (e) { fsFailed = true; }
    fsBusy = false; renderSaveState();
  }, 200);
}

/* ---------- アーティファクトの記録置き場 ----------
   1ドキュメントにPAGE問ずつ束ねて置く。問題ごとに1件作ると
   ドキュメント数の上限に当たるため。 */
async function dbWrite(from){
  if (!DB || !records.length) return;
  const first = Math.floor(from / PAGE);
  const last  = Math.floor((records.length - 1) / PAGE);
  dbBusy = true; renderSaveState();
  try {
    for (let n = first; n <= last; n++){
      await DB.doc(pagePath(n)).set({ items: records.slice(n * PAGE, (n + 1) * PAGE) });
    }
    savedCount = records.length;
    savedJson  = JSON.stringify(records);
    dbFailed = false;
  } catch (e) {
    dbFailed = true;
  }
  dbBusy = false; renderSaveState();
}

/* アーティファクトとして開かれていれば db に切り替える。
   使えるかどうかは開いてみるまで分からないので、画面は先に出しておき、
   分かった時点で切り替える。待っている間に解いたぶんは取りこぼさない。 */
async function initStore(){
  /* Electron版。preload が用意した mjStore があればそれを使う */
  if (window.mjStore){
    FS = window.mjStore; storeMode = 'fs'; renderSaveState();
    let data = null;
    try { data = await FS.load(); } catch (e) { fsFailed = true; }
    if (data){
      if (data.settings) applySettings(data.settings);
      if (Array.isArray(data.records)) records = data.records.concat(records);
    }
    if (curRec) curIdx = records.indexOf(curRec);
    savedCount = records.length;
    savedJson  = JSON.stringify(records);
    recomputeAgg(); renderStats(); renderFoot(); renderTab();
    if (score.s0 === null) newProblem();     /* 設定を読んでから出し直す */
    renderSaveState();
    return;
  }
  /* ブラウザ版。保存先のファイルを扱えるなら、そこに自動保存する */
  if (typeof window.showSaveFilePicker === 'function'
      && !(window.claude && typeof window.claude.use === 'function')){
    storeMode = 'fsa';
    let h = null;
    try { h = await idbGet('handle'); } catch (e) {}
    renderSaveState();
    if (h) askResume(h);                   /* 2回目以降は引き継ぐか聞く */
    else   askSetup();                     /* 初回は保存の案内を出す */
    return;
  }
  if (!(window.claude && typeof window.claude.use === 'function')) return;
  let db = null;
  try { db = await window.claude.use('db'); } catch (e) { db = null; }
  if (!db){ $('save').hidden = !SHOW_SAVE; renderSaveState(); return; }

  DB = db; storeMode = 'db';
  renderSaveState();

  try {
    const cs = await DB.doc('config/settings').get();
    if (cs.exists) applySettings(cs.data());
  } catch (e) {}

  let remote = [];
  try {
    const snap = await DB.collection('records').get();
    for (const d of snap.docs){
      const b = d.data();
      if (b && Array.isArray(b.items)) remote = remote.concat(b.items);
    }
  } catch (e) { dbFailed = true; }

  const local = records;                  // 読み込みを待つ間に解いたぶん
  records = remote.concat(local);
  if (curRec) curIdx = records.indexOf(curRec);
  recomputeAgg();
  renderStats();
  renderTab();

  renderFoot();
  if (score.s0 === null) newProblem();        // まだ答えていなければ、読み込んだ設定で作り直す
  if (local.length){
    await dbWrite(remote.length);
  } else {
    savedCount = records.length;
    savedJson  = JSON.stringify(records);
    renderSaveState();
  }
}
function saveFile(){
  if (!MARK.test(PRISTINE)){
    alert('記録を書き込む場所が見つかりません。ファイルが壊れている可能性があります。');
    return;
  }
  const json = JSON.stringify(records).replace(/</g, '\\u003c');
  const conf = JSON.stringify({ on: settings.on, notenRate: settings.notenRate, score: settings.score, rules: settings.rules }).replace(/</g, '\\u003c');
  const html = PRISTINE.replace(MARK, (m, head, tail) => head + json + tail)
                       .replace(MARK2, (m, head, tail) => head + conf + tail);
  const url = URL.createObjectURL(new Blob([html], { type:'text/html' }));
  const a = document.createElement('a');
  a.href = url; a.download = 'tenpai-knock.html';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 3000);
  savedCount = records.length;
  savedJson = JSON.stringify(records);
  renderSaveState();
}

/* 記録から、卓を描くのに使える形を組み立て直す */
function recProblem(r){
  const hand = new Array(34).fill(0);
  for (const t of (r.hand || [])) hand[t]++;
  return {
    hand, bakaze:r.ba, jikaze:r.ji, seatOfOya:r.oya, winBy:r.by,
    riichi: !!r.ri,
    tenpai: r.kind !== 'noten', yakuKind: r.kind,
    waits: r.waits || [], answerTile: r.win == null ? null : r.win,
    answerYaku: [], answerKeys: r.yaku || [],
    dora: r.dora == null ? null : r.dora,
    ura:  r.ura  == null ? null : r.ura
  };
}
const yakuLabel = k => yakuLabelOf(k);
function tileRow(list){
  const g = el('grp');
  for (const t of list) g.appendChild(tileEl(t));
  return g;
}
const hhmm = iso => {
  const d = new Date(iso);
  return isNaN(d) ? '' : (d.getMonth()+1) + '/' + d.getDate() + ' ' +
    String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
};
const ymd = iso => {
  const d = new Date(iso);
  return isNaN(d) ? '' : d.getFullYear() + '-' +
    String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
};

/* ---------- 記録一覧 ---------- */
let openRec = -1;                        // 開いている記録の番号

function markEl(v, dk){
  if (dk) return el('mk q', '？');
  return el('mk ' + (v === true ? 'o' : v === false ? 'x' : ''),
            v === true ? '○' : v === false ? '×' : '−');
}
const dkOf = (r, i) => !!(r.dk && r.dk[i]);
/* 記録から同じ問題をもう一度出す */
function startReview(r){
  review = r;
  P = recProblem(r);
  said0 = { ba:null, ji:null };
  said1 = null; picked = new Set(); pickedYaku = new Set();
  score = { s0:null, s1:null, s2:null, s3:null, s4:null };
  dunno = { s0:false, s1:false, s2:false, s3:false, s4:false };
  said4 = null; q4opts = null; q5opts = null;
  curRec = null; curIdx = -1;
  tab = 'drill'; renderTab();
  render();

function recDetail(r, i){
  const box = el('rec-open');
  const Q = recProblem(r);
  box.appendChild(tableEl({ p:Q, inline:true, win:true, showSelf:true }));

  const ans = el('rec-ans');
  const line = (label, build) => {
    const row = el('row');
    row.appendChild(el('lab', label));
    build(row);
    ans.appendChild(row);
  };
  if (r.ok0 != null){
    const w = r.w || [null, null];
    const txt = a => '場 ' + (a[0] == null ? '—' : JP[a[0]]) + '／自 ' + (a[1] == null ? '—' : JP[a[1]]);
    line('風', row => {
      row.appendChild(dkOf(r,0) ? el('dk', '分からない') : el(r.ok0 ? 'ok' : 'ng', txt(w)));
      if (!r.ok0) row.appendChild(el('ok', '→ ' + txt([r.ba, r.ji])));
    });
  }
  line('聴牌', row => {
    row.appendChild(dkOf(r,1) ? el('dk', '分からない')
                              : el(r.ok[0] ? 'ok' : 'ng', q1Label(r.a1)));
    if (!r.ok[0]) row.appendChild(el('ok', '→ ' + q1Label(r.kind)));
  });
  if (r.kind !== 'noten'){
    line('待ち', row => {
      if (r.ok[1]) row.appendChild(tileRow(r.waits));
      else if (dkOf(r,2)){
        row.appendChild(el('dk', '分からない'));
        row.appendChild(el('ok', '正解'));  row.appendChild(tileRow(r.waits));
      } else {
        row.appendChild(el('ng', '答え'));  row.appendChild(tileRow(r.a2 || []));
        row.appendChild(el('ok', '正解'));  row.appendChild(tileRow(r.waits));
      }
    });
    const said = (r.a3 || []).map(yakuLabel).join('・') || '（選択なし）';
    const real = realKeys(r).map(yakuLabel).join('・');
    line('役', row => {
      row.appendChild(dkOf(r,3) ? el('dk', '分からない')
                                : el(r.ok[2] ? 'ok' : 'ng', said));
      if (!r.ok[2]) row.appendChild(el('ok', '→ ' + real));
    });
  }
  if (r.ok4 != null){
    line('点数', row => {
      row.appendChild(dkOf(r,4) ? el('dk', '分からない')
                                : el(r.ok4 ? 'ok' : 'ng', r.a4 || '（未選択）'));
      if (!r.ok4 && r.pt) row.appendChild(el('ok', '→ ' + r.pt));
      if (r.hf) row.appendChild(el('lab2', r.hf.fu + '符' + r.hf.han + '翻'
        + (r.hf.dora ? '（ドラ' + r.hf.dora + '）' : '')));
    });
  }
  box.appendChild(ans);
  return box;
}
/* ●×の見出し。sticky にするかどうかだけ切り替える */
function recHead(sticky, label){
  const head = el('rec-head' + (sticky ? '' : ' flat'));
  head.appendChild(el('sp', label));
  const mh = el('mkhead');
  for (const t of ['風','聴牌','待ち','役','点数']) mh.appendChild(el('mkh', t));
  head.appendChild(mh);
  head.appendChild(el('rec-flag', ''));
  head.appendChild(el('redo-sp', ''));
  return head;
}
const REC_NOTE = '\u25cb正解\u3000\u00d7不正解\u3000？分からない\u3000\u2212その設問なし（テンパイしていない手は待ちと役を聞きません）。行を押すと中身が開きます。';

/* 記録1件ぶんの行。一覧からも集計の中からも使う */
function recBlock(i, openIdx, onToggle){
  const r = records[i];
  const wrap = el('rec' + (openIdx === i ? ' open' : ''));

  const row = document.createElement('button');
  row.className = 'rec-row';
  const no = el('rec-no');
  const b = document.createElement('b'); b.textContent = (i + 1);
  no.appendChild(b); no.appendChild(document.createTextNode(hhmm(r.at)));
  row.appendChild(no);

  const hand = el('rec-hand');
  for (const t of (r.hand || [])) hand.appendChild(tileEl(t));
  if (r.win != null) hand.appendChild(tileEl(r.win, 'win drawn'));
  row.appendChild(hand);

  const mk = el('marks');
  mk.appendChild(markEl(r.ok0 == null ? null : !!r.ok0, dkOf(r,0)));
  mk.appendChild(markEl(r.ok ? r.ok[0] : null, dkOf(r,1)));
  mk.appendChild(markEl(r.ok ? r.ok[1] : null, dkOf(r,2)));
  mk.appendChild(markEl(r.ok ? r.ok[2] : null, dkOf(r,3)));
  mk.appendChild(markEl(r.ok4 == null ? null : !!r.ok4, dkOf(r,4)));
  if (r.re) no.appendChild(el('rec-re', 'やり直し'));
  row.appendChild(mk);
  row.appendChild(el('rec-flag', r.mark ? '\u2605' : ''));

  row.onclick = () => onToggle(i);

  const line = el('rec-line');
  line.appendChild(row);
  const again = document.createElement('button');
  again.className = 'btn redo'; again.textContent = 'やり直す';
  again.title = 'この問題をもう一度出す';
  again.onclick = () => startReview(r);
  line.appendChild(again);

  wrap.appendChild(line);
  if (openIdx === i) wrap.appendChild(recDetail(r, i));
  return wrap;
}

function renderList(){
  const v = $('listView'); v.textContent = '';
  if (!records.length){ v.appendChild(el('empty', 'まだ記録がありません。')); return; }

  v.appendChild(recHead(true, '解いた問題（新しい順）'));

  const n = Math.min(listShown, records.length);
  for (let k = 0; k < n; k++){
    const i = records.length - 1 - k;         // 新しいものから
    v.appendChild(recBlock(i, openRec, j => { openRec = (openRec === j ? -1 : j); renderList(); }));
  }
  v.appendChild(el('rec-note', REC_NOTE));

  if (n < records.length){
    const more = document.createElement('button');
    more.className = 'btn more';
    more.textContent = 'さらに表示（残り ' + (records.length - n) + ' 問）';
    more.onclick = () => { listShown += 50; renderList(); };
    v.appendChild(more);
  }
}

/* ---------- 集計 ---------- */
function pctBar(ok, n){
  const td = document.createElement('td'); td.className = 'p';
  const bar = el('bar');
  const track = el('bar-track');
  const fill = el('bar-fill');
  fill.style.width = (n ? Math.round(ok / n * 100) : 0) + '%';
  track.appendChild(fill);
  bar.appendChild(track);
  bar.appendChild(el('bar-val', n ? Math.round(ok / n * 100) + '%' : '—'));
  td.appendChild(bar);
  return td;
}
function aggTable(sec, head, rows){
  const t = document.createElement('table');
  const tr = document.createElement('tr');
  for (const h of head){ const th = document.createElement('th'); th.textContent = h; tr.appendChild(th); }
  t.appendChild(tr);
  for (const row of rows){
    const key = sec + '/' + row.label;
    const open = (aggOpen === key);
    const line = document.createElement('tr');
    const c0 = document.createElement('td');
    c0.textContent = (row.n && row.test ? (open ? '▾ ' : '▸ ') : '') + row.label;
    if (!row.n) c0.className = 'dim';
    line.appendChild(c0);
    const c1 = document.createElement('td'); c1.className = 'n';
    c1.textContent = row.n ? row.ok + '問／' + row.n + '問中' : '—';
    line.appendChild(c1);
    const c2 = document.createElement('td'); c2.className = 'n dim';
    c2.textContent = row.dk ? row.dk + '問' : (row.n ? '—' : '');
    line.appendChild(c2);
    line.appendChild(pctBar(row.ok, row.n));

    /* 行を押すと、その下に該当問題を開く（画面は移らない） */
    if (row.n && row.test){
      line.className = 'link' + (open ? ' on' : '');
      line.onclick = () => {
        if (open) aggOpen = null;
        else { aggOpen = key; aggShown = 50; aggOpenRec = -1; }
        renderAgg();
      };
    }
    t.appendChild(line);
    if (open) t.appendChild(aggExpand(row));
  }
  return t;
